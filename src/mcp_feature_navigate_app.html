            // Feature Selection View
            function renderFeatureSelection(data) {
                var features = Array.isArray(data.features) ? data.features : [];
                var root = document.getElementById("root"); root.innerHTML = "";
                var ha = document.getElementById("headerActions"); ha.innerHTML = "";

                if (!state.creatingFeature) {
                    var btn = document.createElement("button"); btn.className = "btn btn-primary btn-sm";
                    btn.textContent = "+ Feature"; btn.disabled = state.isSaving;
                    btn.addEventListener("click", startNewFeature); ha.appendChild(btn);
                }
                appendUtilityActions(ha);

                if (features.length > 0) {
                    var dash = document.createElement("div"); dash.className = "dashboard";
                    var total = features.length;
                    var verified = features.reduce(function (n, f) { return n + Number(f.verifiedOutcomeCount || 0); }, 0);
                    var totalOutcomes = features.reduce(function (n, f) { return n + Number(f.outcomeCount || 0); }, 0);
                    var activeFeature = features.find(function (f) { return f.isActive; });
                    dash.innerHTML =
                        '<span class="stat-chip"><strong>' + total + '</strong> feature' + (total !== 1 ? "s" : "") + '</span>' +
                        '<span class="stat-chip"><strong>' + totalOutcomes + '</strong> outcome' + (totalOutcomes !== 1 ? "s" : "") + '</span>' +
                        '<span class="stat-chip"><strong>' + verified + '</strong> verified</span>' +
                        (activeFeature ? '<span class="stat-chip">Active: <strong>' + esc(activeFeature.title || activeFeature.id) + '</strong></span>' : "");
                    root.appendChild(dash);
                }

                buildNextStepBanner(data, root);

                if (state.creatingFeature && state.newFeatureDraft) {
                    var d = state.newFeatureDraft;
                    root.appendChild(renderEditor("New Feature", [
                        mkField("ID (slug)", "id", d.id, "newFeature"),
                        mkField("Title", "title", d.title, "newFeature"),
                        mkField("Purpose", "purpose", d.purpose, "newFeature", true),
                        mkField("Outcomes (one per line)", "outcomes", d.outcomes, "newFeature", true, "Optional: list expected outcomes"),
                        mkField("Constraints (one per line)", "constraints", d.constraints, "newFeature", true),
                        mkField("Non-goals (one per line)", "non_goals", d.non_goals, "newFeature", true),
                    ], saveNewFeature, cancelNewFeature));
                    return;
                }

                if (!features.length) {
                    var empty = document.createElement("div"); empty.className = "empty";
                    empty.innerHTML = '<div class="empty-icon">\u{1F3D7}\uFE0F</div><div class="empty-title">No features yet</div><div>Click &ldquo;+ Feature&rdquo; above to create your first feature.</div>';
                    root.appendChild(empty); return;
                }

                var sec = document.createElement("div"); sec.className = "section-header";
                sec.innerHTML = '<span class="section-label">Features</span>'; root.appendChild(sec);

                var grid = document.createElement("div"); grid.className = "feature-grid";
                features.forEach(function (feature) {
                    var isActive = !!feature.isActive;
                    var outcomeCount = Number(feature.outcomeCount || 0);
                    var verifiedCount = Number(feature.verifiedOutcomeCount || 0);
                    var featureKey = cardStateKey("feature", feature.id);

                    var card = makeCollapsibleCard({
                        key: featureKey,
                        baseClass: "card card-collapsible",
                        extraClass: isActive ? "active-card" : "",
                        summaryClass: "card-summary",
                        contentClass: "card-content",
                        toggleClass: "card-toggle",
                        collapsedLabel: "Quick actions",
                        expandedLabel: "Hide actions",
                        accordionGroup: "feature-selection",
                        buildSummary: function (summary) {
                            var row = document.createElement("div"); row.className = "card-row";
                            var body = document.createElement("div"); body.className = "card-body";
                            body.innerHTML = '<div class="card-id">' + esc(feature.id) + '</div><div class="card-title">' + esc(feature.title || feature.id) + '</div>';
                            row.appendChild(body);
                            row.appendChild(badge(isActive ? "active" : String(feature.status || "pending")));
                            summary.appendChild(row);
                            appendFeatureProgress(summary, outcomeCount, verifiedCount);
                        },
                        buildContent: function (content) {
                            var actions = document.createElement("div"); actions.className = "card-actions";
                            var openBtn = document.createElement("button"); openBtn.className = "btn btn-primary btn-sm";
                            openBtn.disabled = state.pendingFeatureId === feature.id || state.isSaving;
                            openBtn.textContent = state.pendingFeatureId === feature.id ? "Loading\u2026" : "Open Outcomes";
                            (function (fid) {
                                openBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); selectFeature(fid); });
                            })(feature.id);
                            actions.appendChild(openBtn);

                            if (!isActive) {
                                var actBtn = document.createElement("button"); actBtn.className = "btn btn-sm";
                                actBtn.disabled = state.isActivating === feature.id || state.isSaving;
                                actBtn.textContent = state.isActivating === feature.id ? "Activating\u2026" : "Activate Feature";
                                (function (fid) {
                                    actBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); activateFeature(fid); });
                                })(feature.id);
                                actions.appendChild(actBtn);
                            }
                            var editBtn = document.createElement("button"); editBtn.className = "btn btn-ghost btn-sm";
                            editBtn.disabled = state.isSaving; editBtn.textContent = "Edit Feature";
                            (function (fid) {
                                editBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); startFeatureEdit(fid); });
                            })(feature.id);
                            actions.appendChild(editBtn);
                            content.appendChild(actions);

                            var note = document.createElement("div");
                            note.className = "card-note";
                            note.textContent = outcomeCount > 0
                                ? verifiedCount + " of " + outcomeCount + " outcomes verified. Open the feature to inspect milestones and tests."
                                : "No outcomes yet. Open the feature to add the first verifiable milestone.";
                            content.appendChild(note);

                            if (state.editingFeatureId === feature.id && state.featureDraft) {
                                var d = state.featureDraft;
                                content.appendChild(renderEditor("Edit: " + feature.id, [
                                    mkField("Title", "title", d.title, "feature"),
                                    mkField("Purpose", "purpose", d.purpose, "feature", true),
                                    mkField("Outcomes (one per line)", "outcomes", d.outcomes, "feature", true),
                                    mkField("Constraints (one per line)", "constraints", d.constraints, "feature", true),
                                    mkField("Non-goals (one per line)", "non_goals", d.non_goals, "feature", true),
                                    mkField("Dependencies (feature IDs, one per line)", "dependencies", d.dependencies, "feature", true),
                                ], saveFeatureEdit, cancelFeatureEdit));
                            }
                        },
                    });
                    grid.appendChild(card);
                });
                root.appendChild(grid);
            }

            // Outcome Selection View
            function renderOutcomeSelection(data) {
                var selectedFeature = data.selectedFeature || {};
                var outcomes = Array.isArray(data.outcomes) ? data.outcomes : [];
                var featureId = data.selectedFeatureId || selectedFeature.id || "";
                var suggestedOrder = Number(data.suggestedNewOutcomeOrder || outcomes.length + 1);
                var root = document.getElementById("root"); root.innerHTML = "";
                var ha = document.getElementById("headerActions"); ha.innerHTML = "";

                var backBtn = document.createElement("button"); backBtn.className = "btn btn-ghost btn-sm";
                backBtn.textContent = "\u2190 Back"; backBtn.addEventListener("click", returnToFeatures); ha.appendChild(backBtn);
                if (!state.creatingOutcome) {
                    var newBtn = document.createElement("button"); newBtn.className = "btn btn-primary btn-sm";
                    newBtn.textContent = "+ Outcome"; newBtn.disabled = state.isSaving;
                    (function (fid, ord) {
                        newBtn.addEventListener("click", function () { startNewOutcome(fid, ord); });
                    })(featureId, suggestedOrder);
                    ha.appendChild(newBtn);
                }
                appendUtilityActions(ha, { featureId: featureId });

                var bcBar = document.getElementById("breadcrumbBar"); bcBar.innerHTML = "";
                var bc = document.createElement("div"); bc.className = "breadcrumb";
                var backLink = document.createElement("span"); backLink.className = "bc-item clickable";
                backLink.textContent = "Features"; backLink.addEventListener("click", returnToFeatures);
                bc.appendChild(backLink);
                bc.innerHTML += '<span class="bc-sep">\u203A</span><span class="bc-item">' + esc(selectedFeature.title || featureId) + '</span>';
                bcBar.appendChild(bc);

                var isActiveF = data.activeFeatureId === featureId;
                var featureOutcomeCount = outcomes.length;
                var featureVerifiedCount = outcomes.filter(function (o) { return o.status === "verified"; }).length;
                var selectedFeatureKey = cardStateKey("selected-feature", featureId);

                var fCard = makeCollapsibleCard({
                    key: selectedFeatureKey,
                    baseClass: "card card-collapsible",
                    extraClass: isActiveF ? "active-card" : "",
                    summaryClass: "card-summary",
                    contentClass: "card-content",
                    toggleClass: "card-toggle",
                    collapsedLabel: "Feature details",
                    expandedLabel: "Hide details",
                    buildSummary: function (summary) {
                        var fRow = document.createElement("div"); fRow.className = "card-row";
                        var fBody = document.createElement("div"); fBody.className = "card-body";
                        fBody.innerHTML = '<div class="card-id">' + esc(featureId) + '</div><div class="card-title">' + esc(selectedFeature.title || featureId) + '</div>';
                        fRow.appendChild(fBody);
                        fRow.appendChild(badge(isActiveF ? "active" : String(selectedFeature.status || "pending")));
                        summary.appendChild(fRow);
                        appendFeatureProgress(summary, featureOutcomeCount, featureVerifiedCount);
                    },
                    buildContent: function (content) {
                        var fActions = document.createElement("div"); fActions.className = "card-actions";
                        if (!isActiveF) {
                            var actBtn = document.createElement("button"); actBtn.className = "btn btn-sm";
                            actBtn.disabled = state.isActivating === featureId || state.isSaving;
                            actBtn.textContent = state.isActivating === featureId ? "Activating\u2026" : "Activate Feature";
                            (function (fid) {
                                actBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); activateFeature(fid); });
                            })(featureId);
                            fActions.appendChild(actBtn);
                        }
                        var feEditBtn = document.createElement("button"); feEditBtn.className = "btn btn-ghost btn-sm";
                        feEditBtn.disabled = state.isSaving; feEditBtn.textContent = "Edit Feature";
                        (function (fid) {
                            feEditBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); startFeatureEdit(fid); });
                        })(featureId);
                        fActions.appendChild(feEditBtn);
                        appendActionButton(fActions, { title: "Feature Spec", tool: "specrail_feature_show", args: { id: featureId } });
                        appendActionButton(fActions, { title: "All Feature Tests", tool: "specrail_test_list", args: { feature_id: featureId } });
                        content.appendChild(fActions);

                        var featureNote = document.createElement("div");
                        featureNote.className = "card-note";
                        featureNote.textContent = featureVerifiedCount + " of " + featureOutcomeCount + " outcomes are verified for this feature.";
                        content.appendChild(featureNote);

                        if (state.editingFeatureId === featureId && state.featureDraft) {
                            var d = state.featureDraft;
                            content.appendChild(renderEditor("Edit: " + featureId, [
                                mkField("Title", "title", d.title, "feature"),
                                mkField("Purpose", "purpose", d.purpose, "feature", true),
                                mkField("Outcomes (one per line)", "outcomes", d.outcomes, "feature", true),
                                mkField("Constraints (one per line)", "constraints", d.constraints, "feature", true),
                                mkField("Non-goals (one per line)", "non_goals", d.non_goals, "feature", true),
                                mkField("Dependencies (feature IDs, one per line)", "dependencies", d.dependencies, "feature", true),
                            ], saveFeatureEdit, cancelFeatureEdit));
                        }
                    },
                });
                fCard.style.marginBottom = "12px";
                root.appendChild(fCard);

                buildNextStepBanner(data, root);

                if (state.creatingOutcome && state.newOutcomeDraft) {
                    var d = state.newOutcomeDraft;
                    root.appendChild(renderEditor("New Outcome", [
                        mkField("ID (slug)", "outcome_id", d.outcome_id, "newOutcome"),
                        mkField("Title", "title", d.title, "newOutcome"),
                        mkField("Goal", "goal", d.goal, "newOutcome", true, "What does this outcome prove when verified?"),
                        mkField("Order", "order", d.order, "newOutcome"),
                        mkField("Allowed paths (one glob per line)", "allowed_paths", d.allowed_paths, "newOutcome", true),
                        mkField("Forbidden paths (one glob per line)", "forbidden_paths", d.forbidden_paths, "newOutcome", true),
                        mkField("Required tests (one path per line)", "required_tests", d.required_tests, "newOutcome", true, "Test file paths that must pass"),
                    ], saveNewOutcome, cancelNewOutcome));
                }

                if (!outcomes.length && !state.creatingOutcome) {
                    var empty = document.createElement("div"); empty.className = "empty";
                    empty.innerHTML = '<div class="empty-icon">\u{1F3AF}</div><div class="empty-title">No outcomes yet</div><div>Click &ldquo;+ Outcome&rdquo; to add the first verifiable milestone.</div>';
                    root.appendChild(empty); return;
                }

                if (outcomes.length > 0) {
                    var sec = document.createElement("div"); sec.className = "section-header";
                    sec.innerHTML = '<span class="section-label">Outcomes</span><span class="stat-chip"><strong>' + featureVerifiedCount + '/' + outcomes.length + '</strong> verified</span>';
                    root.appendChild(sec);

                    var list = document.createElement("ul"); list.className = "outcome-list";
                    outcomes.forEach(function (outcome) {
                        var isActiveOutcome = !!outcome.isActive;
                        var cls = "outcome-item";
                        if (isActiveOutcome) cls += " active-outcome";
                        if (outcome.status === "verified") cls += " verified-outcome";
                        if (outcome.status === "failed") cls += " failed-outcome";
                        var outcomeKey = cardStateKey("outcome", featureId, outcome.id);

                        var item = makeCollapsibleCard({
                            key: outcomeKey,
                            baseClass: cls + " outcome-item-collapsible",
                            summaryClass: "outcome-summary",
                            contentClass: "outcome-content",
                            toggleClass: "outcome-toggle",
                            collapsedLabel: "Inspect outcome",
                            expandedLabel: "Hide outcome",
                            accordionGroup: "outcome-selection:" + featureId,
                            buildSummary: function (summary) {
                                var row = document.createElement("div"); row.className = "outcome-row";
                                var body = document.createElement("div"); body.className = "outcome-body";
                                var review = getOutcomeReview(outcome);
                                body.innerHTML =
                                    '<div class="outcome-num">Outcome ' + esc(outcome.order != null ? outcome.order : "?") + '</div>' +
                                    '<div class="outcome-title">' + esc(outcome.title || outcome.id) + '</div>' +
                                    '<div class="outcome-id">' + esc(outcome.id) + '</div>' +
                                    '<div class="outcome-goal">' + esc(outcome.goal || "") + '</div>';

                                var tc = Number(outcome.testCount || 0);
                                var passingCount = Number(outcome.passingTestCount || 0);
                                var plannedCount = Number(outcome.plannedTestCount || 0);
                                var chips = document.createElement("div"); chips.className = "test-chips";
                                if (tc > 0) {
                                    var all = document.createElement("span"); all.className = "test-chip"; all.textContent = tc + " test" + (tc !== 1 ? "s" : ""); chips.appendChild(all);
                                    if (passingCount > 0) { var p = document.createElement("span"); p.className = "test-chip passing"; p.textContent = passingCount + " passing"; chips.appendChild(p); }
                                    if (plannedCount > 0) { var pl = document.createElement("span"); pl.className = "test-chip warning"; pl.textContent = plannedCount + " planned"; chips.appendChild(pl); }
                                } else if (outcome.status !== "verified" && outcome.status !== "skipped") {
                                    var noTest = document.createElement("span"); noTest.className = "test-chip warning"; noTest.textContent = "no tests"; chips.appendChild(noTest);
                                }
                                if (review && review.missing_required_tests && review.missing_required_tests.length > 0) {
                                    var missing = document.createElement("span"); missing.className = "test-chip danger"; missing.textContent = review.missing_required_tests.length + " missing"; chips.appendChild(missing);
                                }
                                if (review && review.has_no_required_tests) {
                                    var unscoped = document.createElement("span"); unscoped.className = "test-chip danger"; unscoped.textContent = "add required tests"; chips.appendChild(unscoped);
                                }
                                if (chips.childNodes.length > 0) body.appendChild(chips);
                                row.appendChild(body);
                                row.appendChild(badge(String(outcome.status || "pending")));
                                summary.appendChild(row);
                            },
                            buildContent: function (content) {
                                var review = getOutcomeReview(outcome);
                                var actions = document.createElement("div"); actions.className = "card-actions";

                                if (outcome.status !== "verified" && outcome.status !== "skipped" && !isActiveOutcome) {
                                    var actBtn = document.createElement("button"); actBtn.className = "btn btn-primary btn-sm";
                                    actBtn.disabled = state.isActivating === outcome.id || state.isSaving;
                                    actBtn.textContent = state.isActivating === outcome.id ? "Activating\u2026" : "Activate Outcome";
                                    (function (fid, oid) {
                                        actBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); activateOutcome(fid, oid); });
                                    })(featureId, outcome.id);
                                    actions.appendChild(actBtn);
                                }

                                if (isActiveOutcome) {
                                    if (outcome.status !== "verified" && outcome.status !== "skipped") {
                                        appendActionButton(actions, { title: "Run Implement", tool: "specrail_implement", kind: "primary", refresh: true });
                                        appendActionButton(actions, { title: "Run Verify", tool: "specrail_verify", kind: "success", refresh: true });
                                        if (review && review.needs_generation) appendActionButton(actions, { title: "Generate Missing Tests", tool: "specrail_test_generate", refresh: true });
                                    }
                                    if (outcome.status === "verified") {
                                        appendActionButton(actions, { title: "Advance To Next Outcome", tool: "specrail_advance", kind: "success", refresh: true });
                                    }
                                }

                                if (["verified", "failed", "skipped"].indexOf(String(outcome.status || "")) >= 0) {
                                    appendActionButton(actions, {
                                        title: "Reset Status",
                                        tool: "specrail_outcome_unverify",
                                        args: { feature_id: featureId, outcome_id: outcome.id },
                                        kind: "danger",
                                        refresh: true,
                                    });
                                }
                                appendActionButton(actions, { title: "Outcome Spec", tool: "specrail_outcome_show", args: { feature_id: featureId, outcome_id: outcome.id } });

                                var editBtn = document.createElement("button"); editBtn.className = "btn btn-ghost btn-sm";
                                editBtn.disabled = state.isSaving; editBtn.textContent = "Edit Outcome";
                                (function (fid, oid) {
                                    editBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); startOutcomeEdit(fid, oid); });
                                })(featureId, outcome.id);
                                actions.appendChild(editBtn);
                                content.appendChild(actions);

                                var outcomeMeta = document.createElement("div");
                                outcomeMeta.className = "card-note";
                                outcomeMeta.textContent = outcome.goal || "No outcome goal recorded.";
                                content.appendChild(outcomeMeta);

                                var healthSection = renderTestHealthSection(featureId, outcome, isActiveOutcome);
                                if (healthSection) content.appendChild(healthSection);

                                var suggestionPreviewSection = renderSuggestionPreview(featureId, outcome.id);
                                if (suggestionPreviewSection) content.appendChild(suggestionPreviewSection);

                                var relatedTestsSection = renderRelatedTestsSection(featureId, outcome);
                                if (relatedTestsSection) content.appendChild(relatedTestsSection);

                                if (state.editingOutcomeId === outcome.id && state.outcomeDraft) {
                                    var d = state.outcomeDraft;
                                    content.appendChild(renderEditor("Edit: " + outcome.id, [
                                        mkField("Title", "title", d.title, "outcome"),
                                        mkField("Goal", "goal", d.goal, "outcome", true),
                                        mkField("Order", "order", d.order, "outcome"),
                                        mkField("Prerequisites (one outcome ID per line)", "prerequisites", d.prerequisites, "outcome", true),
                                        mkField("Allowed paths (one glob per line)", "allowed_paths", d.allowed_paths, "outcome", true),
                                        mkField("Forbidden paths (one glob per line)", "forbidden_paths", d.forbidden_paths, "outcome", true),
                                        mkField("Required tests (one path per line)", "required_tests", d.required_tests, "outcome", true),
                                    ], saveOutcomeEdit, cancelOutcomeEdit));
                                }
                            },
                        });
                        var li = document.createElement("li"); li.appendChild(item); list.appendChild(li);
                    });
                    root.appendChild(list);
                }
            }

            // Main render
            function applyHostStyles() {
                var root = document.documentElement;
                var vars = state.hostContext && state.hostContext.styles && state.hostContext.styles.variables;
                if (vars && typeof vars === "object")
                    Object.entries(vars).forEach(function (kv) { if (typeof kv[1] === "string") root.style.setProperty(kv[0], kv[1]); });
                var theme = state.hostContext && state.hostContext.theme;
                if (theme === "dark" || theme === "light") root.style.colorScheme = theme;
            }

            function render() {
                applyHostStyles();
                var bcBar = document.getElementById("breadcrumbBar");
                if (bcBar) bcBar.innerHTML = "";

                var result = state.toolResult;
                var data = (result && result.structuredContent && typeof result.structuredContent === "object") ? result.structuredContent : {};

                if (!result) {
                    document.getElementById("root").innerHTML = '<div class="empty"><div class="empty-icon">\u{1F682}</div><div class="empty-title">Specrail</div><div>Waiting for data\u2026</div></div>';
                    document.getElementById("headerActions").innerHTML = "";
                    renderWorkflowBar({}); return;
                }

                if (result.isError) {
                    document.getElementById("root").innerHTML = '<div class="empty"><div class="empty-icon">\u26A0\uFE0F</div><div class="empty-title">Error</div><div>' + esc(toolText(result) || "The MCP tool returned an error.") + '</div></div>';
                    document.getElementById("headerActions").innerHTML = "";
                    appendLog("Tool error: " + toolText(result), "error"); return;
                }

                renderWorkflowBar(data);
                if (data.mode === "outcome_selection") renderOutcomeSelection(data);
                else renderFeatureSelection(data);
                reportSize();
            }

            function reportSize() {
                sendNotification("ui/notifications/size-changed", { width: 680, height: 680 });
            }

            window.addEventListener("message", function (event) {
                var msg = event.data;
                if (!msg || msg.jsonrpc !== "2.0") return;
                if (typeof msg.id !== "undefined" && pending.has(msg.id)) {
                    var req = pending.get(msg.id); pending.delete(msg.id);
                    if (Object.prototype.hasOwnProperty.call(msg, "result")) req.resolve(msg.result);
                    else req.reject(new Error((msg.error && msg.error.message) || "Unknown error"));
                    return;
                }
                if (msg.method === "ui/resource-teardown" && typeof msg.id !== "undefined") { sendResponse(msg.id, {}); return; }
                if (msg.method === "ui/notifications/tool-input") {
                    state.toolArguments = (msg.params && msg.params.arguments && typeof msg.params.arguments === "object") ? msg.params.arguments : {};
                    return;
                }
                if (msg.method === "ui/notifications/tool-result") { state.toolResult = msg.params; render(); reportSize(); return; }
                if (msg.method === "ui/notifications/tool-cancelled") { appendLog("Cancelled: " + ((msg.params && msg.params.reason) || "Operation was cancelled."), "warn"); return; }
                if (msg.method === "ui/notifications/open-file-result") {
                    var path = msg.params && msg.params.path;
                    if (path) {
                        if (msg.params.opened === true) {
                            setFileOpenState(path, "opened", (msg.params.message || "Host acknowledged the file-open request."));
                            appendLog("Host acknowledged file open: " + path, "success");
                        } else {
                            setFileOpenState(path, "fallback", (msg.params.message || "Host declined the file-open request. Use the inline test panel instead."));
                            appendLog("Host declined file open: " + path, "warn");
                        }
                        render();
                    }
                    return;
                }
                if (msg.method === "ui/notifications/host-context-changed") { state.hostContext = merge(state.hostContext, msg.params || {}); render(); }
            });

            new ResizeObserver(function () { reportSize(); }).observe(document.body);

            (async function () {
                appendLog("Specrail Navigator initializing\u2026", "muted");
                try {
                    var init = await sendRequest("ui/initialize", {
                        protocolVersion: "2026-01-26",
                        clientInfo: { name: "specrail-navigator", version: "3.0.0" },
                        capabilities: {}, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
                    });
                    state.hostContext = (init && init.hostContext && typeof init.hostContext === "object") ? init.hostContext : {};
                    applyHostStyles();
                    sendNotification("ui/notifications/initialized", {});
                    appendLog("Connected. Ready.", "success");
                    render(); reportSize();
                } catch (e) { appendLog("Init error: " + (e && e.message ? e.message : String(e)), "error"); }
            })();
        })();
    </script>
</body>

</html>

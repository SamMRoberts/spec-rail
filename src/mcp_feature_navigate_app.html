<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specrail</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: light-dark(#f0f1f3, #1a1a1e);
            --bg-card: light-dark(#ffffff, #252529);
            --bg-card-hover: light-dark(#f5f7fb, #2d2d32);
            --bg-section: light-dark(#f8f9fc, #1e1e22);
            --fg: light-dark(#111827, #e2e4e9);
            --fg-muted: light-dark(#6b7280, #9ca3af);
            --fg-dim: light-dark(#9ca3af, #6b7280);
            --border: light-dark(#e5e7eb, #3e3e44);
            --border-focus: light-dark(#3b82f6, #60a5fa);
            --accent: light-dark(#2563eb, #3b82f6);
            --accent-soft: light-dark(#eff6ff, #1e2d4a);
            --active-bg: light-dark(#fffbeb, #2d2000);
            --active-border: light-dark(#f59e0b, #f59e0b);
            --active-fg: light-dark(#92400e, #fbbf24);
            --verified-bg: light-dark(#f0fdf4, #052e16);
            --verified-border: light-dark(#22c55e, #22c55e);
            --verified-fg: light-dark(#166534, #4ade80);
            --failed-bg: light-dark(#fff1f2, #3b0000);
            --failed-border: light-dark(#ef4444, #ef4444);
            --failed-fg: light-dark(#991b1b, #fca5a5);
            --pending-bg: light-dark(#f9fafb, #252529);
            --pending-border: light-dark(#d1d5db, #4b5563);
            --pending-fg: light-dark(#6b7280, #9ca3af);
            --progress-track: light-dark(#e5e7eb, #374151);
            --progress-fill: light-dark(#22c55e, #22c55e);
            --console-bg: #0f1117;
            --console-border-top: #2a2a35;
            --console-toolbar-bg: #161620;
            --console-fg: #c8cdd8;
            --console-fg-muted: #4a4d5a;
            --console-ts: #3d4050;
            --console-info: #60a5fa;
            --console-success: #4ade80;
            --console-error: #f87171;
            --console-action: #c084fc;
            --console-warn: #fbbf24;
            --radius: 6px;
            --radius-lg: 10px;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
            --console-height: 138px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-ui);
            font-size: 13px;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
        }

        /* App shell */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 720px;
            height: 680px;
            margin: 0 auto;
            background: var(--bg);
            overflow: hidden;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }

        .app-header {
            flex-shrink: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            padding: 10px 12px 14px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .app-body::-webkit-scrollbar {
            width: 5px;
        }

        .app-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .app-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .app-console {
            flex-shrink: 0;
            height: var(--console-height);
            background: var(--console-bg);
            border-top: 1px solid var(--console-border-top);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px 0;
        }

        .header-logo {
            font-size: 17px;
            line-height: 1;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-tag {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid var(--border-focus);
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Workflow stepper */
        .workflow-bar {
            display: flex;
            align-items: center;
            padding: 6px 14px 8px;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .workflow-bar::-webkit-scrollbar {
            display: none;
        }

        .wf-step {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 500;
            color: var(--fg-dim);
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
        }

        .wf-num {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid var(--pending-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            background: var(--bg-card);
            flex-shrink: 0;
            transition: all 120ms;
        }

        .wf-step.wf-done .wf-num {
            background: var(--verified-border);
            border-color: var(--verified-border);
            color: #fff;
        }

        .wf-step.wf-active .wf-num {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
        }

        .wf-step.wf-active .wf-label {
            color: var(--accent);
            font-weight: 700;
        }

        .wf-step.wf-done .wf-label {
            color: var(--verified-fg);
        }

        .wf-sep {
            width: 14px;
            height: 1.5px;
            background: var(--pending-border);
            flex-shrink: 0;
            margin: 0 2px;
        }

        .wf-sep.wf-done {
            background: var(--verified-border);
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--fg-muted);
            padding: 5px 14px 7px;
            border-top: 1px solid var(--border);
        }

        .bc-item.clickable {
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }

        .bc-item.clickable:hover {
            text-decoration: underline;
        }

        .bc-sep {
            color: var(--fg-dim);
            font-size: 12px;
        }

        /* Buttons */
        .btn {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--fg);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            padding: 4px 9px;
            transition: background 80ms, border-color 80ms, opacity 80ms;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            border-color: var(--accent);
        }

        .btn-success {
            background: var(--verified-border);
            border-color: var(--verified-border);
            color: #fff;
        }

        .btn-success:hover {
            filter: brightness(1.1);
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--fg-muted);
        }

        .btn-ghost:hover {
            background: var(--bg-card-hover);
            border-color: var(--border);
            color: var(--fg);
        }

        .btn-danger {
            background: transparent;
            border-color: transparent;
            color: var(--failed-fg);
        }

        .btn-danger:hover {
            background: var(--failed-bg);
            border-color: var(--failed-border);
        }

        .btn-sm {
            padding: 3px 7px;
            font-size: 11px;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Dashboard */
        .dashboard {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        .stat-chip strong {
            color: var(--fg);
            font-weight: 600;
        }

        /* Next step banner */
        .next-banner {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px 12px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--accent);
            background: var(--accent-soft);
            margin-bottom: 12px;
        }

        .next-banner-icon {
            font-size: 17px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .next-banner-body {
            flex: 1;
            min-width: 0;
        }

        .next-banner-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .next-banner-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 3px;
        }

        .next-banner-desc {
            font-size: 11px;
            color: var(--fg-muted);
            line-height: 1.5;
        }

        .next-banner-actions {
            margin-top: 8px;
        }

        /* Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        /* Cards */
        .feature-grid {
            display: grid;
            gap: 6px;
            margin-bottom: 8px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            transition: border-color 100ms, box-shadow 100ms;
        }

        .card:hover {
            border-color: var(--border-focus);
            box-shadow: 0 1px 6px light-dark(rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.35));
        }

        .card.active-card {
            border-color: var(--active-border);
            background: var(--active-bg);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--active-border) 18%, transparent);
        }

        .card-collapsible,
        .outcome-item-collapsible {
            overflow: hidden;
        }

        .card-summary,
        .outcome-summary {
            list-style: none;
            cursor: pointer;
            padding: 8px 11px;
            user-select: none;
        }

        .card-summary::-webkit-details-marker,
        .outcome-summary::-webkit-details-marker {
            display: none;
        }

        .card-summary:hover,
        .outcome-summary:hover {
            background: color-mix(in srgb, var(--bg-card-hover) 75%, transparent);
        }

        .card-content,
        .outcome-content {
            padding: 0 11px 8px;
        }

        .card-toggle,
        .outcome-toggle {
            font-size: 10px;
            color: var(--fg-muted);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .card-toggle::before,
        .outcome-toggle::before {
            content: "\25B8";
            font-size: 10px;
            transition: transform 120ms ease;
            display: inline-block;
        }

        .card-collapsible[open] .card-toggle::before,
        .outcome-item-collapsible[open] .outcome-toggle::before {
            transform: rotate(90deg);
        }

        .card-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-id {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg-muted);
            margin-bottom: 1px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .card-note {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 7px;
        }

        /* Progress */
        .progress-wrap {
            margin-top: 4px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--fg-muted);
            margin-bottom: 3px;
        }

        .progress-bar {
            height: 4px;
            background: var(--progress-track);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 2px;
            transition: width 400ms ease;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 20px;
            border: 1px solid;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-active {
            background: var(--active-bg);
            border-color: var(--active-border);
            color: var(--active-fg);
        }

        .badge-verified {
            background: var(--verified-bg);
            border-color: var(--verified-border);
            color: var(--verified-fg);
        }

        .badge-failed {
            background: var(--failed-bg);
            border-color: var(--failed-border);
            color: var(--failed-fg);
        }

        .badge-pending {
            background: var(--pending-bg);
            border-color: var(--pending-border);
            color: var(--pending-fg);
        }

        .badge-skipped {
            background: var(--pending-bg);
            border-color: var(--pending-border);
            color: var(--fg-dim);
        }

        /* Test chips */
        .test-chips {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            margin-top: 3px;
        }

        .test-chip {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-section);
            color: var(--fg-muted);
        }

        .test-chip.passing {
            color: var(--verified-fg);
            border-color: var(--verified-border);
            background: var(--verified-bg);
        }

        .test-chip.warning {
            color: var(--active-fg);
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .test-chip.danger {
            color: var(--failed-fg);
            border-color: var(--failed-border);
            background: var(--failed-bg);
        }

        /* Outcomes */
        .outcome-list {
            list-style: none;
            display: grid;
            gap: 5px;
            margin-bottom: 8px;
        }

        .outcome-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            transition: border-color 100ms;
        }

        .outcome-item:hover {
            border-color: var(--border-focus);
        }

        .outcome-item.active-outcome {
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .outcome-item.verified-outcome {
            border-left: 3px solid var(--verified-border);
        }

        .outcome-item.failed-outcome {
            border-left: 3px solid var(--failed-border);
        }

        .outcome-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .outcome-body {
            flex: 1;
            min-width: 0;
        }

        .outcome-num {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg-muted);
            margin-bottom: 1px;
        }

        .outcome-title {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
        }

        .outcome-id {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg-muted);
        }

        .outcome-goal {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }

        .section-card {
            margin-top: 8px;
            padding: 8px 9px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-section);
        }

        .section-card:first-child {
            margin-top: 0;
        }

        .section-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .section-card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--fg);
        }

        .section-card-copy {
            font-size: 11px;
            color: var(--fg-muted);
            line-height: 1.45;
        }

        .suggestion-list,
        .path-list,
        .related-test-list {
            list-style: none;
            display: grid;
            gap: 4px;
            margin-top: 6px;
        }


        .suggestion-preview-list {
            list-style: none;
            display: grid;
            gap: 5px;
            margin-top: 6px;
        }

        .suggestion-preview-item {
            padding: 6px;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .suggestion-preview-path {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg);
        }

        .suggestion-preview-copy {
            font-size: 10px;
            color: var(--fg-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .suggestion-preview-note {
            font-size: 10px;
            color: var(--fg-muted);
            margin-top: 6px;
        }

        .suggestion-list li,
        .path-list li {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg);
            padding: 4px 6px;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .related-test-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 6px;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .related-test-main {
            flex: 1;
            min-width: 0;
        }

        .related-test-id {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--fg-muted);
        }

        .related-test-path {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .related-test-meta {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .related-test-status {
            font-size: 10px;
            margin-top: 4px;
            line-height: 1.35;
        }

        .related-test-status.pending {
            color: var(--accent);
        }

        .related-test-status.opened {
            color: var(--verified-fg);
        }

        .related-test-status.fallback {
            color: var(--active-fg);
        }

        .inline-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        /* Editor */
        .editor {
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .editor-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .field-grid {
            display: grid;
            gap: 8px;
        }

        label {
            display: grid;
            gap: 3px;
            font-size: 12px;
        }

        label span {
            font-weight: 600;
            color: var(--fg-muted);
            font-size: 11px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-section);
            color: var(--fg);
            padding: 5px 8px;
            font: inherit;
            font-size: 12px;
            transition: border-color 100ms;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--border-focus) 20%, transparent);
        }

        textarea {
            min-height: 60px;
            resize: vertical;
        }

        .field-hint {
            font-size: 10px;
            color: var(--fg-muted);
        }

        /* Empty */
        .empty {
            text-align: center;
            padding: 24px 16px;
            color: var(--fg-muted);
            border: 1.5px dashed var(--border);
            border-radius: var(--radius-lg);
            font-size: 12px;
            line-height: 1.6;
        }

        .empty-icon {
            font-size: 26px;
            margin-bottom: 7px;
        }

        .empty-title {
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 3px;
            font-size: 13px;
        }

        /* Console */
        .console-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--console-toolbar-bg);
            border-bottom: 1px solid var(--console-border-top);
            flex-shrink: 0;
        }

        .console-dots {
            display: flex;
            gap: 4px;
        }

        .cdot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .cdot-r {
            background: #ff5f57;
        }

        .cdot-y {
            background: #ffbd2e;
        }

        .cdot-g {
            background: #28ca41;
        }

        .console-title {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            color: var(--console-fg-muted);
            letter-spacing: 0.04em;
            flex: 1;
            text-align: center;
        }

        .console-btn {
            appearance: none;
            background: transparent;
            border: none;
            color: var(--console-fg-muted);
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            transition: color 80ms, background 80ms;
        }

        .console-btn:hover {
            color: var(--console-fg);
            background: rgba(255, 255, 255, 0.06);
        }

        .console-entries {
            flex: 1;
            overflow-y: auto;
            padding: 3px 0;
            font-family: var(--font-mono);
            font-size: 11px;
            scrollbar-width: thin;
            scrollbar-color: #2a2a35 transparent;
        }

        .console-entries::-webkit-scrollbar {
            width: 4px;
        }

        .console-entries::-webkit-scrollbar-track {
            background: transparent;
        }

        .console-entries::-webkit-scrollbar-thumb {
            background: #2a2a35;
            border-radius: 2px;
        }

        .console-entry {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 1px 10px;
            line-height: 1.55;
        }

        .console-entry:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        .con-ts {
            color: var(--console-ts);
            font-size: 9px;
            flex-shrink: 0;
            padding-top: 2px;
            min-width: 38px;
        }

        .con-icon {
            flex-shrink: 0;
            padding-top: 1px;
            font-size: 10px;
        }

        .con-msg {
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .con-info .con-msg {
            color: var(--console-info);
        }

        .con-success .con-msg {
            color: var(--console-success);
        }

        .con-error .con-msg {
            color: var(--console-error);
        }

        .con-action .con-msg {
            color: var(--console-action);
        }

        .con-warn .con-msg {
            color: var(--console-warn);
        }

        .con-muted .con-msg {
            color: var(--console-fg-muted);
        }

        .con-default .con-msg {
            color: var(--console-fg);
        }

        @media (max-width: 460px) {
            .wf-label {
                display: none;
            }

            .wf-sep {
                width: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="app-header">
            <div class="header">
                <span class="header-logo">&#x1F682;</span>
                <span class="header-title">Specrail</span>
                <span class="header-tag">TDD</span>
                <div class="header-actions" id="headerActions"></div>
            </div>
            <div id="workflowBar" class="workflow-bar"></div>
            <div id="breadcrumbBar"></div>
        </div>
        <div class="app-body" id="root">
            <div class="empty">
                <div class="empty-icon">&#x1F682;</div>
                <div class="empty-title">Specrail</div>
                <div>Connecting&hellip;</div>
            </div>
        </div>
        <div class="app-console">
            <div class="console-toolbar">
                <div class="console-dots">
                    <div class="cdot cdot-r"></div>
                    <div class="cdot cdot-y"></div>
                    <div class="cdot cdot-g"></div>
                </div>
                <span class="console-title">specrail &mdash; console</span>
                <button class="console-btn" id="consoleClear" title="Clear console">&#x232B; clear</button>
            </div>
            <div class="console-entries" id="consoleEntries"></div>
        </div>
    </div>

    <script>
        (() => {
            const state = {
                hostContext: {}, toolArguments: {}, toolResult: null,
                pendingFeatureId: null, editingFeatureId: null, editingOutcomeId: null,
                creatingFeature: false, creatingOutcome: false,
                featureDraft: null, outcomeDraft: null, newFeatureDraft: null, newOutcomeDraft: null,
                isSaving: false, isActivating: null,
                runningAction: null,
                expandedCards: {},
                expandedPanels: {},
                fileOpenStates: {},
                suggestionPreviews: {},
                suggestionPreviewErrors: {},
            };
            let nextId = 1;
            const pending = new Map();

            // Console
            const CON_ICONS = { info: "\u2139", success: "\u2713", error: "\u2717", action: "\u25C6", warn: "\u26A0", muted: "\u00B7", default: "\u203A" };

            function appendLog(msg, type) {
                type = type || "default";
                const el = document.getElementById("consoleEntries");
                if (!el) return;
                const now = new Date();
                const ts = now.toTimeString().slice(0, 8);
                const entry = document.createElement("div");
                entry.className = "console-entry con-" + type;
                entry.innerHTML =
                    '<span class="con-ts">' + ts + '</span>' +
                    '<span class="con-icon">' + (CON_ICONS[type] || "\u203A") + '</span>' +
                    '<span class="con-msg">' + esc(msg) + '</span>';
                el.appendChild(entry);
                el.scrollTop = el.scrollHeight;
                while (el.children.length > 200) el.removeChild(el.firstChild);
            }

            function clearConsole() {
                var el = document.getElementById("consoleEntries");
                if (el) el.innerHTML = "";
            }

            document.getElementById("consoleClear").addEventListener("click", clearConsole);

            // IPC
            function sendRequest(m, p) {
                var id = nextId++;
                window.parent.postMessage({ jsonrpc: "2.0", id: id, method: m, params: p }, "*");
                return new Promise(function (res, rej) { pending.set(id, { resolve: res, reject: rej }); });
            }
            function sendRequestWithTimeout(m, p, timeoutMs) {
                var id = nextId++;
                window.parent.postMessage({ jsonrpc: "2.0", id: id, method: m, params: p }, "*");
                return new Promise(function (res, rej) {
                    var timeout = setTimeout(function () {
                        if (!pending.has(id)) return;
                        pending.delete(id);
                        rej(new Error("Timed out waiting for host acknowledgement."));
                    }, timeoutMs || 800);
                    pending.set(id, {
                        resolve: function (value) {
                            clearTimeout(timeout);
                            res(value);
                        },
                        reject: function (error) {
                            clearTimeout(timeout);
                            rej(error);
                        }
                    });
                });
            }
            function sendNotification(m, p) { window.parent.postMessage({ jsonrpc: "2.0", method: m, params: p }, "*"); }
            function sendResponse(id, r) { window.parent.postMessage({ jsonrpc: "2.0", id: id, result: r }, "*"); }
            function callTool(name, args) { return sendRequest("tools/call", { name: name, arguments: args }); }

            // Utilities
            function esc(v) {
                return String(v == null ? "" : v)
                    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;").replaceAll('"', '&quot;').replaceAll("'", "&#39;");
            }
            function toolText(r) { return (r && r.content && r.content.find(function (b) { return b && b.type === "text"; }) || {}).text || ""; }
            function merge(t, s) {
                if (!s || typeof s !== "object") return t;
                Object.entries(s).forEach(function (kv) {
                    var k = kv[0], v = kv[1];
                    t[k] = (v && typeof v === "object" && !Array.isArray(v))
                        ? merge(t[k] && typeof t[k] === "object" ? t[k] : {}, v) : v;
                });
                return t;
            }
            function linesToArray(v) { return String(v == null ? "" : v).split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
            function arrayToLines(v) { return Array.isArray(v) ? v.join("\n") : ""; }
            function cardStateKey(kind) {
                var parts = Array.prototype.slice.call(arguments, 1).map(function (p) { return String(p == null ? "" : p); });
                return [kind].concat(parts).join(":");
            }
            function panelStateKey(kind) {
                var parts = Array.prototype.slice.call(arguments, 1).map(function (p) { return String(p == null ? "" : p); });
                return [kind].concat(parts).join(":");
            }
            function isCardExpanded(key, accordionGroup) {
                return accordionGroup ? state.expandedCards[accordionGroup] === key : state.expandedCards[key] === true;
            }
            function setCardExpanded(key, expanded, accordionGroup) {
                if (accordionGroup) {
                    if (expanded) state.expandedCards[accordionGroup] = key;
                    else if (state.expandedCards[accordionGroup] === key) delete state.expandedCards[accordionGroup];
                    return;
                }
                state.expandedCards[key] = expanded;
            }
            function ensureCardExpanded(key, accordionGroup) {
                if (!isCardExpanded(key, accordionGroup)) setCardExpanded(key, true, accordionGroup);
            }
            function isPanelExpanded(key) { return state.expandedPanels[key] === true; }
            function togglePanelExpanded(key) {
                state.expandedPanels[key] = !state.expandedPanels[key];
                render();
            }

            // Workflow steps
            var WORKFLOW_STEPS = [
                { id: "feature", label: "Feature", tip: "Select or create a feature to work on" },
                { id: "outcome", label: "Outcome", tip: "Choose an outcome milestone to target" },
                { id: "tests", label: "Tests", tip: "Write tests that define the outcome" },
                { id: "implement", label: "Implement", tip: "Run AI-assisted implementation" },
                { id: "verify", label: "Verify", tip: "Run tests to confirm implementation" },
                { id: "advance", label: "Advance", tip: "Move to the next outcome or complete feature" },
            ];

            function computeWorkflowStep(data) {
                if (!data) return "feature";
                var mode = data.mode;
                var features = Array.isArray(data.features) ? data.features : [];

                if (mode === "outcome_selection") {
                    var outcomes = Array.isArray(data.outcomes) ? data.outcomes : [];
                    if (!outcomes.length) return "outcome";
                    var activeOutcome = outcomes.find(function (o) { return o.isActive; });
                    if (!activeOutcome) return "outcome";
                    var st = activeOutcome.status;
                    var tc = Number(activeOutcome.testCount || 0);
                    var pc = Number(activeOutcome.plannedTestCount || 0);
                    if (st === "verified") return "advance";
                    if (tc === 0 || pc > 0) return "tests";
                    if (st === "failed") return "implement";
                    return "implement";
                }

                if (!features.length) return "feature";
                if (!data.activeFeatureId) return "feature";
                return "feature";
            }

            function renderWorkflowBar(data) {
                var bar = document.getElementById("workflowBar");
                if (!bar) return;
                bar.innerHTML = "";
                var currentStepId = computeWorkflowStep(data);
                var currentIdx = WORKFLOW_STEPS.findIndex(function (s) { return s.id === currentStepId; });

                WORKFLOW_STEPS.forEach(function (step, i) {
                    var isDone = i < currentIdx;
                    var isActive = i === currentIdx;

                    var el = document.createElement("div");
                    el.className = "wf-step" + (isDone ? " wf-done" : "") + (isActive ? " wf-active" : "");
                    el.title = step.tip;

                    var num = document.createElement("div");
                    num.className = "wf-num";
                    num.textContent = isDone ? "\u2713" : String(i + 1);
                    el.appendChild(num);

                    var lbl = document.createElement("span");
                    lbl.className = "wf-label";
                    lbl.textContent = step.label;
                    el.appendChild(lbl);
                    bar.appendChild(el);

                    if (i < WORKFLOW_STEPS.length - 1) {
                        var sep = document.createElement("div");
                        sep.className = "wf-sep" + (isDone ? " wf-done" : "");
                        bar.appendChild(sep);
                    }
                });
            }

            // Next step banner
            function buildNextStepBanner(data, root) {
                var mode = data && data.mode;
                var features = Array.isArray(data && data.features) ? data.features : [];
                var outcomes = Array.isArray(data && data.outcomes) ? data.outcomes : [];
                var activeOutcome = outcomes.find(function (o) { return o.isActive; });
                var icon, label, title, desc, actions = [];

                if (mode === "feature_selection") {
                    if (!features.length) {
                        icon = "\u{1F3D7}\uFE0F"; label = "Step 1 of 6 \u2014 Feature";
                        title = "Create your first feature";
                        desc = "Features define what you're building. Each feature contains outcome milestones and tests.";
                        actions = [{ text: "+ New Feature", fn: startNewFeature, kind: "primary" }];
                    } else if (!data.activeFeatureId) {
                        icon = "\u{1F4C2}"; label = "Step 1 of 6 \u2014 Feature";
                        title = "Open a feature to get started";
                        desc = "Open a feature card to inspect its outcomes and start the TDD loop.";
                    } else {
                        var af = features.find(function (f) { return f.isActive; });
                        if (af) {
                            icon = "\u25B6\uFE0F"; label = "Active Feature";
                            title = "Continue with: " + (af.title || af.id);
                            desc = "Open the active feature to review outcomes, tests, and the next milestone.";
                            actions = [{ text: "Open Active Feature", fn: function () { selectFeature(af.id); }, kind: "primary" }];
                        }
                    }
                } else if (mode === "outcome_selection") {
                    if (!outcomes.length) {
                        icon = "\u{1F3AF}"; label = "Step 2 of 6 \u2014 Outcome";
                        title = "Add your first outcome";
                        desc = "Outcomes are verifiable milestones. Each outcome has tests that prove it's complete.";
                    } else if (!activeOutcome) {
                        icon = "\u{1F3AF}"; label = "Step 2 of 6 \u2014 Outcome";
                        title = "Activate an outcome to begin";
                        desc = "Activate one outcome so implementation, verification, and test generation target the right milestone.";
                    } else {
                        var tc = Number(activeOutcome.testCount || 0);
                        var pc = Number(activeOutcome.plannedTestCount || 0);
                        var needsGeneration = !!activeOutcome.needsTestGeneration;
                        var st = activeOutcome.status;
                        if (tc === 0 || needsGeneration) {
                            icon = "\u{1F9EA}"; label = "Step 3 of 6 \u2014 Tests";
                            title = tc === 0 ? "Add outcome tests" : "Close the remaining test gaps";
                            desc = needsGeneration
                                ? "Generate or register the missing required tests before implementation so the outcome has a complete test target."
                                : "Register the outcome tests first so implementation has a concrete target to satisfy.";
                            actions = [{ text: "Generate Missing Tests", fn: function () { runToolAction("Generate Missing Tests", "specrail_test_generate", {}, { refresh: true }); }, kind: "primary" }];
                        } else if (pc > 0) {
                            icon = "\u{1F9EA}"; label = "Step 3 of 6 \u2014 Tests";
                            title = pc + " test" + (pc > 1 ? "s" : "") + " still in planned status";
                            desc = "Move planned tests to written or passing before implementation so the outcome gate can run cleanly.";
                            actions = [{ text: "Generate Missing Tests", fn: function () { runToolAction("Generate Missing Tests", "specrail_test_generate", {}, { refresh: true }); }, kind: "primary" }];
                        } else if (st === "active" || st === "failed") {
                            icon = "\u2699\uFE0F"; label = "Step 4 of 6 \u2014 Implement";
                            title = st === "failed" ? "Implementation failed \u2014 try again" : "Ready to implement";
                            desc = "Specrail will use the active agent to write code that satisfies your tests.";
                            actions = [
                                { text: "Run Implement", fn: function () { runToolAction("Run Implement", "specrail_implement", {}, { refresh: true }); }, kind: "primary" },
                                { text: "Run Verify", fn: function () { runToolAction("Run Verify", "specrail_verify", {}, { refresh: true }); }, kind: "default" },
                            ];
                        } else if (st === "verified") {
                            icon = "\u{1F680}"; label = "Step 6 of 6 \u2014 Advance";
                            title = "Outcome verified! Ready to advance";
                            desc = "All tests pass. Advance to activate the next outcome in sequence.";
                            actions = [{ text: "Advance To Next Outcome", fn: function () { runToolAction("Advance To Next Outcome", "specrail_advance", {}, { refresh: true }); }, kind: "success" }];
                        }
                    }
                }

                if (!title) return;

                var banner = document.createElement("div");
                banner.className = "next-banner";
                var iconEl = document.createElement("div");
                iconEl.className = "next-banner-icon";
                iconEl.textContent = icon;
                var body = document.createElement("div");
                body.className = "next-banner-body";
                body.innerHTML =
                    '<div class="next-banner-label">' + esc(label) + '</div>' +
                    '<div class="next-banner-title">' + esc(title) + '</div>' +
                    '<div class="next-banner-desc">' + esc(desc) + '</div>';
                if (actions.length) {
                    var act = document.createElement("div");
                    act.className = "next-banner-actions btn-group";
                    actions.forEach(function (a) {
                        var b = document.createElement("button");
                        b.className = "btn btn-sm btn-" + (a.kind || "default");
                        b.textContent = a.text;
                        b.disabled = state.isSaving || !!state.runningAction;
                        b.addEventListener("click", a.fn);
                        act.appendChild(b);
                    });
                    body.appendChild(act);
                }
                banner.appendChild(iconEl);
                banner.appendChild(body);
                root.appendChild(banner);
            }

            // Collapsible cards
            function makeCollapsibleCard(options) {
                var key = options.key, baseClass = options.baseClass, extraClass = options.extraClass || "",
                    summaryClass = options.summaryClass, contentClass = options.contentClass,
                    toggleClass = options.toggleClass, collapsedLabel = options.collapsedLabel,
                    expandedLabel = options.expandedLabel, buildSummary = options.buildSummary,
                    buildContent = options.buildContent, accordionGroup = options.accordionGroup;

                var details = document.createElement("details");
                details.className = (baseClass + " " + extraClass).trim();
                details.open = isCardExpanded(key, accordionGroup);
                details.addEventListener("toggle", function () {
                    setCardExpanded(key, details.open, accordionGroup);
                    render();
                });

                var summary = document.createElement("summary");
                summary.className = summaryClass;
                buildSummary(summary, details.open);

                var toggle = document.createElement("span");
                toggle.className = toggleClass;
                toggle.textContent = details.open ? expandedLabel : collapsedLabel;
                summary.appendChild(toggle);
                details.appendChild(summary);

                var content = document.createElement("div");
                content.className = contentClass;
                buildContent(content);
                details.appendChild(content);
                return details;
            }

            // Badge
            function badge(status) {
                var map = {
                    active: ["badge-active", "\u26A1 Active"],
                    verified: ["badge-verified", "\u2705 Verified"],
                    failed: ["badge-failed", "\u2717 Failed"],
                    pending: ["badge-pending", "\u25CB Pending"],
                    skipped: ["badge-skipped", "\u2013 Skipped"],
                    planned: ["badge-pending", "\u25CB Planned"],
                };
                var pair = map[status] || ["badge-pending", status];
                var el = document.createElement("span");
                el.className = "badge " + pair[0];
                el.textContent = pair[1];
                return el;
            }

            // Core actions
            async function selectFeature(featureId) {
                state.pendingFeatureId = featureId; render();
                appendLog("Opening feature: " + featureId, "action");
                try {
                    state.toolResult = await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments, { feature_id: featureId }));
                    state.pendingFeatureId = null; state.editingFeatureId = null; state.featureDraft = null;
                    state.creatingOutcome = false; state.newOutcomeDraft = null;
                    appendLog("Loaded feature: " + featureId, "success");
                    render();
                } catch (e) {
                    state.pendingFeatureId = null;
                    appendLog("Error: " + (e && e.message ? e.message : String(e)), "error");
                    render();
                }
            }

            async function returnToFeatures() {
                state.editingFeatureId = null; state.editingOutcomeId = null;
                state.featureDraft = null; state.outcomeDraft = null;
                state.creatingFeature = false; state.newFeatureDraft = null;
                appendLog("Returning to feature list\u2026", "muted");
                try {
                    state.toolResult = await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments));
                    appendLog("Feature list loaded.", "success"); render();
                } catch (e) { appendLog("Error: " + (e && e.message ? e.message : String(e)), "error"); render(); }
            }

            async function refreshView() {
                var sc = state.toolResult && state.toolResult.structuredContent;
                state.toolResult = (sc && sc.mode === "outcome_selection" && sc.selectedFeatureId)
                    ? await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments, { feature_id: sc.selectedFeatureId }))
                    : await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments));
            }

            async function runToolAction(title, name, args, options) {
                args = args || {}; options = options || {};
                var refresh = options.refresh || false;
                var actionKey = name + ":" + JSON.stringify(args);
                state.runningAction = actionKey;
                appendLog("Running: " + title + "\u2026", "action");
                render();
                try {
                    var result = await callTool(name, Object.assign({}, state.toolArguments, args));
                    var text = toolText(result);
                    if (result && result.isError) {
                        appendLog(title + " failed: " + (text || "Unknown error"), "error");
                        state.runningAction = null; render(); return;
                    }
                    if (text) appendLog(title + ": " + text, "success");
                    else appendLog(title + " completed.", "success");
                    if (refresh) await refreshView();
                    state.runningAction = null; render();
                } catch (e) {
                    appendLog(title + " error: " + (e && e.message ? e.message : String(e)), "error");
                    state.runningAction = null; render();
                }
            }

            function isActionRunning(name, args) {
                args = args || {};
                return state.runningAction === (name + ":" + JSON.stringify(args));
            }

            function appendActionButton(container, config) {
                var title = config.title, tool = config.tool, args = config.args || {},
                    kind = config.kind || "default", refresh = config.refresh || false;
                var button = document.createElement("button");
                button.className = kind === "primary" ? "btn btn-primary btn-sm"
                    : kind === "ghost" ? "btn btn-ghost btn-sm"
                        : kind === "success" ? "btn btn-success btn-sm"
                            : kind === "danger" ? "btn btn-danger btn-sm"
                                : "btn btn-sm";
                button.disabled = state.isSaving || isActionRunning(tool, args);
                button.textContent = isActionRunning(tool, args) ? (title + "\u2026") : title;
                button.addEventListener("click", function () { runToolAction(title, tool, args, { refresh: refresh }); });
                container.appendChild(button);
            }

            async function activateFeature(id) {
                state.isActivating = id; render();
                appendLog("Activating feature: " + id, "action");
                try {
                    await callTool("specrail_feature_activate", Object.assign({}, state.toolArguments, { id: id }));
                    await refreshView();
                    appendLog("Feature activated: " + id, "success");
                    state.isActivating = null; render();
                } catch (e) {
                    appendLog("Error: " + (e && e.message ? e.message : String(e)), "error");
                    state.isActivating = null; render();
                }
            }

            async function activateOutcome(featureId, outcomeId) {
                state.isActivating = outcomeId; render();
                appendLog("Activating outcome: " + outcomeId, "action");
                try {
                    await callTool("specrail_outcome_activate", Object.assign({}, state.toolArguments, { feature_id: featureId, outcome_id: outcomeId }));
                    await refreshView();
                    appendLog("Outcome activated: " + outcomeId, "success");
                    state.isActivating = null; render();
                } catch (e) {
                    appendLog("Error: " + (e && e.message ? e.message : String(e)), "error");
                    state.isActivating = null; render();
                }
            }

            function getOutcomeReview(outcome) {
                return outcome && outcome.testReview && typeof outcome.testReview === "object" ? outcome.testReview : null;
            }

            function reviewSummary(review) {
                if (!review) return { tone: "muted", text: "Test health is not available for this outcome yet." };
                if (review.has_no_required_tests) return { tone: "warn", text: "Add required test paths to make this outcome verifiable." };
                if (review.has_no_related_tests) return { tone: "warn", text: "No manifest tests are linked to this outcome yet." };
                if (review.missing_required_tests.length > 0) return { tone: "warn", text: review.missing_required_tests.length + " required test path" + (review.missing_required_tests.length !== 1 ? "s are" : " is") + " still missing from the manifest." };
                if (review.planned_required_tests.length > 0) return { tone: "warn", text: review.planned_required_tests.length + " required test" + (review.planned_required_tests.length !== 1 ? "s remain" : " remains") + " in planned status." };
                return { tone: "success", text: "Required tests are linked and ready to drive implementation." };
            }

            function testStatusChipClass(status) {
                return status === "passing" ? "passing"
                    : status === "planned" ? "warning"
                        : status === "failing" ? "danger"
                            : "";
            }

            function appendTestChip(container, label, tone) {
                var chip = document.createElement("span");
                chip.className = "test-chip" + (tone ? " " + tone : "");
                chip.textContent = label;
                container.appendChild(chip);
            }

            function renderPathList(paths, className) {
                var list = document.createElement("ul");
                list.className = className || "path-list";
                paths.forEach(function (path) {
                    var item = document.createElement("li");
                    item.textContent = path;
                    list.appendChild(item);
                });
                return list;
            }

            function fileOpenStateKey(path) {
                return panelStateKey("open-file", path);
            }

            function getFileOpenState(path) {
                return state.fileOpenStates[fileOpenStateKey(path)] || null;
            }

            function setFileOpenState(path, status, message) {
                state.fileOpenStates[fileOpenStateKey(path)] = { status: status, message: message };
            }

            async function requestOpenRelatedTest(path) {
                var params = {
                    path: path,
                    cwd: state.toolArguments && state.toolArguments.cwd ? state.toolArguments.cwd : null,
                };

                setFileOpenState(path, "pending", "Awaiting host acknowledgement for the file-open request.");
                render();

                try {
                    var result = await sendRequestWithTimeout("ui/requests/open-file", params, 900);
                    if (result && result.opened === false) {
                        throw new Error(result.message || "Host declined the file-open request.");
                    }

                    setFileOpenState(path, "opened", "Host acknowledged the file-open request.");
                    appendLog("Host acknowledged file open: " + path, "success");
                } catch (e) {
                    sendNotification("ui/notifications/open-file", params);
                    setFileOpenState(path, "fallback", "No acknowledgement received. Sent a best-effort open notification; keep using the inline test panel if nothing opens.");
                    appendLog("No host acknowledgement for file open: " + path + ". Sent fallback notification.", "warn");
                }

                render();
            }

            function suggestionPreviewKey(featureId, outcomeId) {
                return panelStateKey("ai-suggestions", featureId, outcomeId);
            }

            function getSuggestionPreview(featureId, outcomeId) {
                return state.suggestionPreviews[suggestionPreviewKey(featureId, outcomeId)] || null;
            }

            function getSuggestionPreviewError(featureId, outcomeId) {
                return state.suggestionPreviewErrors[suggestionPreviewKey(featureId, outcomeId)] || null;
            }

            async function previewOutcomeSuggestions(featureId, outcomeId) {
                var actionKey = "test-suggest:" + featureId + ":" + outcomeId;
                state.runningAction = actionKey;
                delete state.suggestionPreviewErrors[suggestionPreviewKey(featureId, outcomeId)];
                appendLog("Previewing AI test suggestions for: " + outcomeId, "action");
                render();
                try {
                    var result = await callTool("specrail_test_suggest", Object.assign({}, state.toolArguments, {
                        feature_id: featureId,
                        outcome_id: outcomeId,
                    }));
                    if (result && result.isError) {
                        throw new Error(toolText(result) || "Suggestion preview failed.");
                    }

                    var preview = result && result.structuredContent && result.structuredContent.preview;
                    state.suggestionPreviews[suggestionPreviewKey(featureId, outcomeId)] = preview || null;
                    appendLog("AI preview ready for: " + outcomeId, "success");
                } catch (e) {
                    state.suggestionPreviewErrors[suggestionPreviewKey(featureId, outcomeId)] = e && e.message ? e.message : String(e);
                    appendLog("AI preview failed for " + outcomeId + ": " + (e && e.message ? e.message : String(e)), "error");
                }
                state.runningAction = null;
                render();
            }

            function renderSuggestionPreview(featureId, outcomeId) {
                var preview = getSuggestionPreview(featureId, outcomeId);
                var previewError = getSuggestionPreviewError(featureId, outcomeId);
                if (!preview && !previewError) return null;

                var section = document.createElement("div");
                section.className = "section-card";

                var head = document.createElement("div");
                head.className = "section-card-head";
                head.innerHTML = '<span class="section-card-title">AI preview suggestions</span>';
                var previewBadge = badge(preview && preview.exact_path_match ? "verified" : "failed");
                previewBadge.textContent = preview && preview.exact_path_match ? "\u2713 Match" : "\u26A0 Review";
                head.appendChild(previewBadge);
                section.appendChild(head);

                var copy = document.createElement("div");
                copy.className = "section-card-copy";
                if (previewError) {
                    copy.textContent = previewError;
                    section.appendChild(copy);
                    return section;
                }

                copy.textContent = "Preview only. These suggestions did not write files or update the manifest.";
                section.appendChild(copy);

                var chips = document.createElement("div");
                chips.className = "test-chips";
                appendTestChip(chips, preview.suggestions.length + " suggestion" + (preview.suggestions.length !== 1 ? "s" : ""), "");
                if (preview.missing_expected_paths.length > 0) appendTestChip(chips, preview.missing_expected_paths.length + " missing", "danger");
                if (preview.unexpected_paths.length > 0) appendTestChip(chips, preview.unexpected_paths.length + " unexpected", "warning");
                section.appendChild(chips);

                if (Array.isArray(preview.suggestions) && preview.suggestions.length > 0) {
                    var list = document.createElement("ul");
                    list.className = "suggestion-preview-list";
                    preview.suggestions.forEach(function (suggestion) {
                        var item = document.createElement("li");
                        item.className = "suggestion-preview-item";
                        item.innerHTML =
                            '<div class="suggestion-preview-path">' + esc(suggestion.path) + '</div>' +
                            '<div class="related-test-meta"></div>' +
                            '<div class="suggestion-preview-copy">' + esc(suggestion.content_preview || "No content preview available.") + '</div>';
                        var meta = item.querySelector(".related-test-meta");
                        appendTestChip(meta, String(suggestion.kind || "unit"), "");
                        appendTestChip(meta, String(suggestion.content_line_count || 0) + " lines", "");
                        list.appendChild(item);
                    });
                    section.appendChild(list);
                }

                if (preview.missing_expected_paths.length > 0) {
                    var missingTitle = document.createElement("div");
                    missingTitle.className = "card-note";
                    missingTitle.textContent = "Still missing from the AI preview";
                    section.appendChild(missingTitle);
                    section.appendChild(renderPathList(preview.missing_expected_paths, "path-list"));
                }

                if (preview.unexpected_paths.length > 0) {
                    var unexpectedTitle = document.createElement("div");
                    unexpectedTitle.className = "card-note";
                    unexpectedTitle.textContent = "Unexpected preview paths";
                    section.appendChild(unexpectedTitle);
                    section.appendChild(renderPathList(preview.unexpected_paths, "path-list"));
                }

                var note = document.createElement("div");
                note.className = "suggestion-preview-note";
                note.textContent = "Agent: " + esc(preview.agent || "unknown") + " • Scope: " + esc(preview.scope_label || (featureId + ":" + outcomeId));
                section.appendChild(note);
                return section;
            }

            function renderTestHealthSection(featureId, outcome, isActiveOutcome) {
                var review = getOutcomeReview(outcome);
                if (!review) return null;

                var summary = reviewSummary(review);
                var section = document.createElement("div");
                section.className = "section-card";

                var head = document.createElement("div");
                head.className = "section-card-head";
                head.innerHTML = '<span class="section-card-title">Test health</span>';

                healthBadge.textContent = review.has_gaps ? "\u26A0 Gaps" : "\u2713 Ready";
                head.appendChild(healthBadge);
                section.appendChild(head);

                var copy = document.createElement("div");
                copy.className = "section-card-copy";
                copy.textContent = summary.text;
                section.appendChild(copy);

                var chips = document.createElement("div");
                chips.className = "test-chips";
                appendTestChip(chips, review.related_test_count + " linked", "");

                if (review.missing_required_tests.length > 0) appendTestChip(chips, review.missing_required_tests.length + " missing", "danger");
                if (review.planned_required_tests.length > 0) appendTestChip(chips, review.planned_required_tests.length + " planned", "warning");
                if (review.undeclared_tests.length > 0) appendTestChip(chips, review.undeclared_tests.length + " undeclared", "warning");
                section.appendChild(chips);

                if (review.suggested_test_paths.length > 0) {
                    var suggestionTitle = document.createElement("div");

                    section.appendChild(suggestionTitle);
                    section.appendChild(renderPathList(review.suggested_test_paths, "suggestion-list"));
                }

                if (review.required_test_paths.length > 0 && review.suggested_test_paths.length === 0 && review.related_test_count === 0) {
                    var requiredTitle = document.createElement("div");
                    requiredTitle.className = "card-note";
                    requiredTitle.textContent = "Required test paths";
                    section.appendChild(requiredTitle);
                    section.appendChild(renderPathList(review.required_test_paths, "path-list"));
                }

                var actionRow = document.createElement("div");
                actionRow.className = "inline-actions";

                if (review.required_test_count > 0 && review.has_gaps) {
                    var previewBtn = document.createElement("button");
                    previewBtn.className = "btn btn-sm";
                    previewBtn.disabled = state.isSaving || state.runningAction === suggestionActionKey;
                    previewBtn.textContent = state.runningAction === suggestionActionKey
                        ? "Previewing AI Suggestions…"
                        : (getSuggestionPreview(featureId, outcome.id) ? "Refresh AI Suggestions" : "Preview AI Suggestions");
                    previewBtn.addEventListener("click", function (ev) {
                        ev.preventDefault();
                        ev.stopPropagation();
                        previewOutcomeSuggestions(featureId, outcome.id);
                    });
                    actionRow.appendChild(previewBtn);
                }

                if (isActiveOutcome && review.needs_generation) {
                    appendActionButton(actionRow, { title: "Generate Missing Tests", tool: "specrail_test_generate", kind: "primary", refresh: true });
                }

                if (actionRow.childNodes.length > 0) {
                    section.appendChild(actionRow);
                }

                return section;
            }

            function renderRelatedTestsSection(featureId, outcome) {
                var review = getOutcomeReview(outcome);
                if (!review) return null;

                var panelKey = panelStateKey("related-tests", featureId, outcome.id);
                var section = document.createElement("div");
                section.className = "section-card";

                var head = document.createElement("div");
                head.className = "section-card-head";
                head.innerHTML = '<span class="section-card-title">Related tests</span>';
                var toggle = document.createElement("button");
                toggle.className = "btn btn-sm";
                toggle.textContent = isPanelExpanded(panelKey) ? "Hide Related Tests" : "Open Related Tests";
                toggle.addEventListener("click", function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    togglePanelExpanded(panelKey);
                });
                head.appendChild(toggle);
                section.appendChild(head);

                var copy = document.createElement("div");
                copy.className = "section-card-copy";
                copy.textContent = review.related_test_count > 0
                    ? review.related_test_count + " manifest test" + (review.related_test_count !== 1 ? "s are" : " is") + " linked to this outcome."
                    : "No manifest tests are linked yet. Use the required test paths below to register or generate them.";
                section.appendChild(copy);

                if (!isPanelExpanded(panelKey)) return section;

                if (review.related_tests.length > 0) {
                    var list = document.createElement("ul");
                    list.className = "related-test-list";
                    review.related_tests.forEach(function (test) {
                        var item = document.createElement("li");
                        item.className = "related-test-item";
                        var fileOpenState = getFileOpenState(test.path);

                        var main = document.createElement("div");
                        main.className = "related-test-main";
                        main.innerHTML =
                            '<div class="related-test-id">' + esc(test.id) + '</div>' +
                            '<div class="related-test-path">' + esc(test.path) + '</div>';
                        var meta = document.createElement("div");
                        meta.className = "related-test-meta";
                        appendTestChip(meta, String(test.kind || "unit"), "");
                        appendTestChip(meta, String(test.status || "planned"), testStatusChipClass(String(test.status || "planned")));
                        main.appendChild(meta);
                        if (fileOpenState && fileOpenState.message) {
                            var statusLine = document.createElement("div");
                            statusLine.className = "related-test-status " + (fileOpenState.status || "fallback");
                            statusLine.textContent = fileOpenState.message;
                            main.appendChild(statusLine);
                        }
                        item.appendChild(main);

                        var openButton = document.createElement("button");
                        openButton.className = "btn btn-sm";
                        openButton.disabled = !!fileOpenState && fileOpenState.status === "pending";
                        openButton.textContent = fileOpenState && fileOpenState.status === "pending"
                            ? "Opening…"
                            : fileOpenState && fileOpenState.status === "opened"
                                ? "Open Again"
                                : "Open File";
                        openButton.addEventListener("click", function (ev) {
                            ev.preventDefault();
                            ev.stopPropagation();
                            requestOpenRelatedTest(test.path);
                        });
                        item.appendChild(openButton);
                        list.appendChild(item);
                    });
                    section.appendChild(list);
                }

                if (review.required_test_paths.length > 0) {
                    var requiredTitle = document.createElement("div");
                    requiredTitle.className = "card-note";
                    requiredTitle.textContent = "Expected required test paths";
                    section.appendChild(requiredTitle);
                    section.appendChild(renderPathList(review.required_test_paths, "path-list"));
                }

                return section;
            }

                appendLog("Loading feature for edit: " + featureId + "\u2026", "muted");
                try {
                    var res = await callTool("specrail_feature_show", Object.assign({}, state.toolArguments, { id: featureId }));
                    var f = (res && res.structuredContent && res.structuredContent.feature) || {};
                    var sc = state.toolResult && state.toolResult.structuredContent;
                    var featureKey = sc && sc.mode === "outcome_selection"
                        ? cardStateKey("selected-feature", featureId)
                        : cardStateKey("feature", featureId);
                    var accordionGroup = sc && sc.mode === "outcome_selection" ? null : "feature-selection";
                    ensureCardExpanded(featureKey, accordionGroup);
                    state.editingFeatureId = featureId;
                    state.featureDraft = {
                        id: f.id || featureId, title: f.title || "", purpose: f.purpose || "",
                        outcomes: arrayToLines(f.outcomes), constraints: arrayToLines(f.constraints),
                        non_goals: arrayToLines(f.non_goals), dependencies: arrayToLines(f.dependencies)
                    };
                    appendLog("Editing feature: " + featureId, "info"); render();
                } catch (e) { appendLog("Error: " + (e && e.message ? e.message : String(e)), "error"); }

            function mkField(label, key, value, target, multiline, hint) {
                var lbl = document.createElement("label");
                lbl.innerHTML = '<span>' + esc(label) + '</span>';
                var inp = document.createElement(multiline ? "textarea" : "input");
                if (!multiline) inp.type = key === "order" ? "number" : "text";
                if (key === "order") inp.min = "1";
                inp.value = value || "";
                inp.addEventListener("input", function (ev) {
                    var v = ev.target.value;
                    if (target === "feature" && state.featureDraft) state.featureDraft[key] = v;
                    if (target === "outcome" && state.outcomeDraft) state.outcomeDraft[key] = v;
                    if (target === "newFeature" && state.newFeatureDraft) state.newFeatureDraft[key] = v;
                    if (target === "newOutcome" && state.newOutcomeDraft) state.newOutcomeDraft[key] = v;
                });
                lbl.appendChild(inp);
                if (hint) { var p = document.createElement("p"); p.className = "field-hint"; p.textContent = hint; lbl.appendChild(p); }
                return lbl;
            }

            function renderEditor(title, fields, onSubmit, onCancel) {
                var wrap = document.createElement("div"); wrap.className = "editor";
                var h = document.createElement("div"); h.className = "editor-title"; h.textContent = title; wrap.appendChild(h);
                var form = document.createElement("form"); form.addEventListener("submit", onSubmit);
                var grid = document.createElement("div"); grid.className = "field-grid";
                fields.forEach(function (f) { grid.appendChild(f); }); form.appendChild(grid);
                var actions = document.createElement("div"); actions.className = "btn-group"; actions.style.marginTop = "10px";
                var save = document.createElement("button"); save.className = "btn btn-primary btn-sm"; save.type = "submit";
                save.disabled = state.isSaving; save.textContent = state.isSaving ? "Saving\u2026" : "Save";
                var cancel = document.createElement("button"); cancel.className = "btn btn-ghost btn-sm"; cancel.type = "button";
                cancel.disabled = state.isSaving; cancel.textContent = "Cancel"; cancel.addEventListener("click", onCancel);
                actions.appendChild(save); actions.appendChild(cancel); form.appendChild(actions); wrap.appendChild(form);
                return wrap;
            }

                    var prog = document.createElement("div");

                    prog.innerHTML =
                        '<div class="progress-label"><span>' + verifiedCount + '/' + outcomeCount + ' outcomes verified</span><span>' + pct + '%</span></div>' +
                        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
                    container.appendChild(prog); return;
                }
                var meta = document.createElement("div"); meta.className = "card-meta"; meta.textContent = "No outcomes yet"; container.appendChild(meta);

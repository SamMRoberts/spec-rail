<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specrail</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: light-dark(#f5f5f5, #1e1e1e);
            --bg-card: light-dark(#ffffff, #252526);
            --bg-card-hover: light-dark(#f9f9f9, #2d2d2d);
            --bg-section: light-dark(#fafafa, #1e1e1e);
            --fg: light-dark(#1e1e1e, #cccccc);
            --fg-muted: light-dark(#6e6e6e, #858585);
            --fg-dim: light-dark(#999, #555);
            --border: light-dark(#e0e0e0, #3c3c3c);
            --border-focus: light-dark(#0078d4, #3794ff);
            --accent: light-dark(#0078d4, #3794ff);
            --active-bg: light-dark(#fff8e7, #2b2000);
            --active-border: light-dark(#f0a500, #f0a500);
            --active-fg: light-dark(#7a5200, #f0c050);
            --verified-bg: light-dark(#e8f5e9, #1a3320);
            --verified-border: light-dark(#4caf50, #4caf50);
            --verified-fg: light-dark(#2e7d32, #81c784);
            --failed-bg: light-dark(#ffebee, #3b0000);
            --failed-border: light-dark(#f44336, #f44336);
            --failed-fg: light-dark(#c62828, #ef9a9a);
            --pending-bg: light-dark(#f5f5f5, #252526);
            --pending-border: light-dark(#bdbdbd, #555);
            --pending-fg: light-dark(#555, #888);
            --skipped-fg: light-dark(#aaa, #555);
            --progress-track: light-dark(#e0e0e0, #3c3c3c);
            --progress-fill: light-dark(#4caf50, #4caf50);
            --radius: 6px;
            --radius-lg: 10px;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", "Cascadia Code", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            font-size: 13px;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
        }

        .app {
            max-width: 680px;
            margin: 0 auto;
            padding: 12px 14px 24px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .header-logo {
            font-size: 18px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--fg-muted);
            margin-bottom: 12px;
        }

        .breadcrumb-item.clickable {
            color: var(--accent);
            cursor: pointer;
        }

        .breadcrumb-item.clickable:hover {
            text-decoration: underline;
        }

        .breadcrumb-sep {
            color: var(--fg-dim);
        }

        .dashboard {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        .stat-chip strong {
            color: var(--fg);
            font-weight: 600;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        .btn {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--fg);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            padding: 5px 10px;
            transition: background 120ms, border-color 120ms;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: default;
            pointer-events: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(0.88);
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--fg-muted);
        }

        .btn-ghost:hover {
            background: var(--bg-card-hover);
            border-color: var(--border);
            color: var(--fg);
        }

        .btn-sm {
            padding: 3px 8px;
            font-size: 11px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .feature-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            transition: border-color 120ms;
        }

        .card:hover {
            border-color: var(--accent);
        }

        .card.active-card {
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .card-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-muted);
            margin-bottom: 2px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 12px;
            color: var(--fg-muted);
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .progress-wrap {
            margin-top: 8px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--fg-muted);
            margin-bottom: 3px;
        }

        .progress-bar {
            height: 5px;
            background: var(--progress-track);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 3px;
            transition: width 300ms;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 20px;
            border: 1px solid;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-active {
            background: var(--active-bg);
            border-color: var(--active-border);
            color: var(--active-fg);
        }

        .badge-verified {
            background: var(--verified-bg);
            border-color: var(--verified-border);
            color: var(--verified-fg);
        }

        .badge-failed {
            background: var(--failed-bg);
            border-color: var(--failed-border);
            color: var(--failed-fg);
        }

        .badge-pending {
            background: var(--pending-bg);
            border-color: var(--pending-border);
            color: var(--pending-fg);
        }

        .badge-skipped {
            background: var(--pending-bg);
            border-color: var(--pending-border);
            color: var(--skipped-fg);
        }

        .test-chips {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .test-chip {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-section);
            color: var(--fg-muted);
        }

        .test-chip.passing {
            color: var(--verified-fg);
            border-color: var(--verified-border);
            background: var(--verified-bg);
        }

        .test-chip.warning {
            color: var(--active-fg);
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .outcome-list {
            list-style: none;
            display: grid;
            gap: 7px;
            margin-bottom: 10px;
        }

        .outcome-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            transition: border-color 120ms;
        }

        .outcome-item:hover {
            border-color: var(--accent);
        }

        .outcome-item.active-outcome {
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .outcome-item.verified-outcome {
            border-left: 3px solid var(--verified-border);
        }

        .outcome-item.failed-outcome {
            border-left: 3px solid var(--failed-border);
        }

        .outcome-num {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg-muted);
            margin-bottom: 2px;
        }

        .outcome-title {
            font-size: 13px;
            font-weight: 600;
        }

        .outcome-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-muted);
        }

        .outcome-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .outcome-body {
            flex: 1;
            min-width: 0;
        }

        .editor {
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .editor-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .field-grid {
            display: grid;
            gap: 9px;
        }

        label {
            display: grid;
            gap: 4px;
            font-size: 12px;
        }

        label span {
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-section);
            color: var(--fg);
            padding: 6px 8px;
            font: inherit;
            font-size: 12px;
            transition: border-color 120ms;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--border-focus) 20%, transparent);
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .field-hint {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }

        .status-bar {
            border-radius: var(--radius);
            padding: 8px 10px;
            font-size: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--fg-muted);
        }

        .status-bar.error {
            border-color: var(--failed-border);
            background: var(--failed-bg);
            color: var(--failed-fg);
        }

        .status-bar.success {
            border-color: var(--verified-border);
            background: var(--verified-bg);
            color: var(--verified-fg);
        }

        .output-panel {
            margin-bottom: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
        }

        .output-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .output-title strong {
            font-size: 12px;
        }

        .output-body {
            white-space: pre-wrap;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-muted);
            max-height: 240px;
            overflow: auto;
        }

        .empty {
            text-align: center;
            padding: 28px 16px;
            color: var(--fg-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
            font-size: 13px;
            line-height: 1.6;
        }

        .empty-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .empty-title {
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 4px;
        }

        @media (max-width: 520px) {
            .app {
                padding: 8px 10px 20px;
            }

            .dashboard {
                gap: 5px;
            }

            .card-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="header">
            <span class="header-logo">&#x1F682;</span>
            <span class="header-title">Specrail</span>
            <div class="header-actions" id="headerActions"></div>
        </div>
        <div id="statusBar"></div>
        <div id="root"></div>
    </div>
    <script>
        (() => {
            const state = {
                hostContext: {}, toolArguments: {}, toolResult: null,
                pendingFeatureId: null, editingFeatureId: null, editingOutcomeId: null,
                creatingFeature: false, creatingOutcome: false,
                featureDraft: null, outcomeDraft: null, newFeatureDraft: null, newOutcomeDraft: null,
                isSaving: false, isActivating: null,
                runningAction: null, lastToolRun: null,
            };
            let nextId = 1;
            const pending = new Map();

            function sendRequest(m, p) {
                const id = nextId++;
                window.parent.postMessage({ jsonrpc: "2.0", id, method: m, params: p }, "*");
                return new Promise((res, rej) => pending.set(id, { resolve: res, reject: rej }));
            }
            function sendNotification(m, p) { window.parent.postMessage({ jsonrpc: "2.0", method: m, params: p }, "*"); }
            function sendResponse(id, r) { window.parent.postMessage({ jsonrpc: "2.0", id, result: r }, "*"); }
            async function callTool(name, args) { return sendRequest("tools/call", { name, arguments: args }); }

            function esc(v) {
                return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                    .replaceAll('"', '&quot;').replaceAll("'", "&#39;");
            }
            function toolText(r) { return r?.content?.find?.(b => b?.type === "text")?.text ?? ""; }
            function merge(t, s) {
                if (!s || typeof s !== "object") return t;
                for (const [k, v] of Object.entries(s))
                    t[k] = (v && typeof v === "object" && !Array.isArray(v)) ? merge(t[k] && typeof t[k] === "object" ? t[k] : {}, v) : v;
                return t;
            }
            function linesToArray(v) { return String(v ?? "").split(/\r?\n/).map(s => s.trim()).filter(Boolean); }
            function arrayToLines(v) { return Array.isArray(v) ? v.join("\n") : ""; }

            function badge(status) {
                const map = {
                    active: ["badge-active", "\u26A1 Active"], verified: ["badge-verified", "\u2705 Verified"],
                    failed: ["badge-failed", "\u274C Failed"], pending: ["badge-pending", "\u25CB Pending"],
                    skipped: ["badge-skipped", "\u2013 Skipped"], planned: ["badge-pending", "\u25CB Planned"],
                };
                const [cls, label] = map[status] ?? ["badge-pending", status];
                const el = document.createElement("span");
                el.className = "badge " + cls; el.textContent = label; return el;
            }

            function showStatus(msg, variant) {
                const el = document.getElementById("statusBar");
                if (!msg) { el.innerHTML = ""; return; }
                el.innerHTML = `<div class="status-bar${variant ? " " + variant : ""}">${esc(msg)}</div>`;
            }

            function setLastToolRun(title, result) {
                const text = toolText(result) || "Command completed successfully.";
                state.lastToolRun = { title, text, isError: !!result?.isError };
            }

            function clearLastToolRun() {
                state.lastToolRun = null;
                render();
            }

            function applyHostStyles() {
                const root = document.documentElement;
                const vars = state.hostContext?.styles?.variables;
                if (vars && typeof vars === "object")
                    for (const [k, v] of Object.entries(vars)) if (typeof v === "string") root.style.setProperty(k, v);
                const theme = state.hostContext?.theme;
                if (theme === "dark" || theme === "light") root.style.colorScheme = theme;
            }

            async function selectFeature(featureId) {
                state.pendingFeatureId = featureId; render();
                try {
                    state.toolResult = await callTool("specrail_feature_navigate", { ...state.toolArguments, feature_id: featureId });
                    state.pendingFeatureId = null; state.editingFeatureId = null; state.featureDraft = null;
                    state.creatingOutcome = false; state.newOutcomeDraft = null; showStatus(""); render();
                } catch (e) { state.pendingFeatureId = null; showStatus(e?.message ?? String(e), "error"); render(); }
            }

            async function returnToFeatures() {
                state.editingFeatureId = null; state.editingOutcomeId = null; state.featureDraft = null;
                state.outcomeDraft = null; state.creatingFeature = false; state.newFeatureDraft = null;
                showStatus("Loading\u2026");
                try { state.toolResult = await callTool("specrail_feature_navigate", { ...state.toolArguments }); showStatus(""); render(); }
                catch (e) { showStatus(e?.message ?? String(e), "error"); render(); }
            }

            async function refreshView() {
                const sc = state.toolResult?.structuredContent;
                state.toolResult = (sc?.mode === "outcome_selection" && sc?.selectedFeatureId)
                    ? await callTool("specrail_feature_navigate", { ...state.toolArguments, feature_id: sc.selectedFeatureId })
                    : await callTool("specrail_feature_navigate", { ...state.toolArguments });
            }

            async function runToolAction(title, name, args = {}, options = {}) {
                const { refresh = false, successMessage = null } = options;
                const actionKey = `${name}:${JSON.stringify(args)}`;
                state.runningAction = actionKey;
                render();

                try {
                    const result = await callTool(name, { ...state.toolArguments, ...args });
                    setLastToolRun(title, result);
                    if (result?.isError) {
                        state.runningAction = null;
                        showStatus(toolText(result) || `${title} failed.`, "error");
                        render();
                        return;
                    }

                    if (refresh) {
                        await refreshView();
                    }

                    state.runningAction = null;
                    showStatus(successMessage || toolText(result), "success");
                    render();
                } catch (e) {
                    state.runningAction = null;
                    showStatus(e?.message ?? String(e), "error");
                    render();
                }
            }

            function isActionRunning(name, args = {}) {
                return state.runningAction === `${name}:${JSON.stringify(args)}`;
            }

            function appendActionButton(container, config) {
                const { title, tool, args = {}, kind = "default", refresh = false, successMessage = null } = config;
                const button = document.createElement("button");
                button.className = kind === "primary" ? "btn btn-primary btn-sm" : kind === "ghost" ? "btn btn-ghost btn-sm" : "btn btn-sm";
                button.disabled = state.isSaving || isActionRunning(tool, args);
                button.textContent = isActionRunning(tool, args) ? `${title}\u2026` : title;
                button.addEventListener("click", () => runToolAction(title, tool, args, { refresh, successMessage }));
                container.appendChild(button);
            }

            function buildOutcomeGapReview(outcome, tests) {
                const declaredRequired = Array.isArray(outcome?.required_tests) ? outcome.required_tests : [];
                const relatedTests = Array.isArray(tests) ? tests : [];
                const testsByPath = new Map(relatedTests.map(test => [test.path, test]));
                const missingRequired = declaredRequired.filter(path => !testsByPath.has(path));
                const plannedRequired = declaredRequired.filter(path => testsByPath.get(path)?.status === "planned");
                const undeclaredTests = declaredRequired.length > 0
                    ? relatedTests.filter(test => !declaredRequired.includes(test.path))
                    : [];
                const hasNoRequiredTests = declaredRequired.length === 0;
                const hasNoRelatedTests = relatedTests.length === 0;
                const needsGeneration = declaredRequired.length > 0 && (missingRequired.length > 0 || plannedRequired.length > 0);
                const hasGaps = hasNoRequiredTests || hasNoRelatedTests || missingRequired.length > 0 || plannedRequired.length > 0;

                return {
                    declaredRequired,
                    relatedTests,
                    missingRequired,
                    plannedRequired,
                    undeclaredTests,
                    hasNoRequiredTests,
                    hasNoRelatedTests,
                    hasGaps,
                    needsGeneration,
                };
            }

            function formatOutcomeGapReview(outcome, review) {
                const lines = [
                    `Outcome: ${outcome?.feature_id ?? "?"}:${outcome?.id ?? "?"}`,
                    `Goal: ${outcome?.goal ?? "No goal recorded."}`,
                    "",
                    `Declared required tests: ${review.declaredRequired.length}`,
                    `Manifest tests for outcome: ${review.relatedTests.length}`,
                ];

                if (review.hasNoRequiredTests) {
                    lines.push("", "Gap: no required test paths are declared on this outcome.");
                    lines.push("Next step: edit the outcome and add required test paths before generating tests.");
                }

                if (review.hasNoRelatedTests && !review.hasNoRequiredTests) {
                    lines.push("", "Gap: no tests for this outcome exist in the manifest yet.");
                }

                if (review.missingRequired.length > 0) {
                    lines.push("", "Missing required test entries:");
                    review.missingRequired.forEach(path => lines.push(`- ${path}`));
                }

                if (review.plannedRequired.length > 0) {
                    lines.push("", "Required tests still in planned status:");
                    review.plannedRequired.forEach(path => lines.push(`- ${path}`));
                }

                if (review.undeclaredTests.length > 0) {
                    lines.push("", "Manifest tests not listed in required_tests:");
                    review.undeclaredTests.forEach(test => lines.push(`- ${test.path} (${test.status})`));
                }

                if (!review.hasGaps) {
                    lines.push("", "No testing gaps found for this outcome.");
                } else if (review.needsGeneration) {
                    lines.push("", "Generation can help: running specrail_test_generate to fill declared required tests.");
                }

                lines.push("", "Note: test generation uses outcome.required_tests across the project and writes any missing declared tests.");
                return lines.join("\n");
            }

            async function checkOutcomeTestGaps(featureId, outcomeId) {
                const actionKey = `gap-check:${featureId}:${outcomeId}`;
                state.runningAction = actionKey;
                render();

                try {
                    const outcomeResult = await callTool("specrail_outcome_show", {
                        ...state.toolArguments,
                        feature_id: featureId,
                        outcome_id: outcomeId,
                    });
                    const testsResult = await callTool("specrail_test_list", {
                        ...state.toolArguments,
                        feature_id: featureId,
                        outcome_id: outcomeId,
                    });

                    const outcome = outcomeResult?.structuredContent?.outcome ?? {};
                    const tests = testsResult?.structuredContent?.tests ?? [];
                    const review = buildOutcomeGapReview(outcome, tests);
                    let report = formatOutcomeGapReview(outcome, review);
                    let variant = review.hasGaps ? "error" : "success";
                    let statusMessage = review.hasGaps
                        ? `Testing gaps found for ${outcomeId}.`
                        : `No testing gaps found for ${outcomeId}.`;

                    if (review.needsGeneration) {
                        const generationResult = await callTool("specrail_test_generate", { ...state.toolArguments });
                        const generationText = toolText(generationResult) || "Test generation completed.";
                        report += `\n\nTest generation output:\n${generationText}`;

                        if (generationResult?.isError) {
                            variant = "error";
                            statusMessage = `Gap check completed, but test generation failed for ${outcomeId}.`;
                        } else {
                            await refreshView();
                            variant = "success";
                            statusMessage = `Gap check completed and additional tests were generated for ${outcomeId}.`;
                        }
                    }

                    state.lastToolRun = {
                        title: `Test Gap Review: ${outcomeId}`,
                        text: report,
                        isError: variant === "error",
                    };
                    state.runningAction = null;
                    showStatus(statusMessage, variant);

                    state.runningAction = null;

            function mkField(label, key, value, target, multiline, hint) {
                const lbl = document.createElement("label");
                lbl.innerHTML = `<span>${esc(label)}</span>`;
                const inp = document.createElement(multiline ? "textarea" : "input");
                if (!multiline) inp.type = key === "order" ? "number" : "text";
                if (key === "order") inp.min = "1";
                inp.value = value ?? "";
                inp.addEventListener("input", ev => {
                    const v = ev.target.value;
                    if (target === "feature" && state.featureDraft) state.featureDraft[key] = v;
                    if (target === "outcome" && state.outcomeDraft) state.outcomeDraft[key] = v;
                    if (target === "newFeature" && state.newFeatureDraft) state.newFeatureDraft[key] = v;
                    if (target === "newOutcome" && state.newOutcomeDraft) state.newOutcomeDraft[key] = v;
                });
                lbl.appendChild(inp);
                if (hint) { const p = document.createElement("p"); p.className = "field-hint"; p.textContent = hint; lbl.appendChild(p); }
                return lbl;
            }

            function renderEditor(title, fields, onSubmit, onCancel) {
                const wrap = document.createElement("div"); wrap.className = "editor";
                const h = document.createElement("div"); h.className = "editor-title"; h.textContent = title; wrap.appendChild(h);
                const form = document.createElement("form"); form.addEventListener("submit", onSubmit);
                const grid = document.createElement("div"); grid.className = "field-grid";
                fields.forEach(f => grid.appendChild(f)); form.appendChild(grid);
                const actions = document.createElement("div"); actions.className = "btn-group"; actions.style.marginTop = "10px";
                const save = document.createElement("button"); save.className = "btn btn-primary btn-sm"; save.type = "submit";
                save.disabled = state.isSaving; save.textContent = state.isSaving ? "Saving\u2026" : "Save";
                const cancel = document.createElement("button"); cancel.className = "btn btn-ghost btn-sm"; cancel.type = "button";
                cancel.disabled = state.isSaving; cancel.textContent = "Cancel"; cancel.addEventListener("click", onCancel);
                actions.appendChild(save); actions.appendChild(cancel); form.appendChild(actions); wrap.appendChild(form); return wrap;
            }

            function renderFeatureSelection(data) {
                const features = Array.isArray(data.features) ? data.features : [];
                const root = document.getElementById("root"); root.innerHTML = "";
                const ha = document.getElementById("headerActions"); ha.innerHTML = "";

                if (!state.creatingFeature) {
                    const btn = document.createElement("button"); btn.className = "btn btn-primary btn-sm";
                    btn.textContent = "+ New Feature"; btn.disabled = state.isSaving;
                    btn.addEventListener("click", startNewFeature); ha.appendChild(btn);
                }
                appendUtilityActions(ha);

                if (features.length > 0) {
                    const dash = document.createElement("div"); dash.className = "dashboard";
                    const total = features.length;
                    const verified = features.reduce((n, f) => n + Number(f.verifiedOutcomeCount ?? 0), 0);
                    const totalOutcomes = features.reduce((n, f) => n + Number(f.outcomeCount ?? 0), 0);
                    dash.innerHTML = `<span class="stat-chip"><strong>${total}</strong> feature${total !== 1 ? "s" : ""}</span><span class="stat-chip"><strong>${totalOutcomes}</strong> outcome${totalOutcomes !== 1 ? "s" : ""}</span><span class="stat-chip"><strong>${verified}</strong> verified</span>`;
                    root.appendChild(dash);
                }

                renderToolOutput(root);

                if (state.creatingFeature && state.newFeatureDraft) {
                    const d = state.newFeatureDraft;
                    root.appendChild(renderEditor("New Feature", [
                        mkField("ID (slug)", "id", d.id, "newFeature"),
                        mkField("Title", "title", d.title, "newFeature"),
                        mkField("Purpose", "purpose", d.purpose, "newFeature", true),
                        mkField("Outcomes (one per line)", "outcomes", d.outcomes, "newFeature", true, "Optional"),
                        mkField("Constraints (one per line)", "constraints", d.constraints, "newFeature", true),
                        mkField("Non-goals (one per line)", "non_goals", d.non_goals, "newFeature", true),
                    ], saveNewFeature, cancelNewFeature));
                    return;
                }

                if (!features.length) {
                    const empty = document.createElement("div"); empty.className = "empty";
                    empty.innerHTML = `<div class="empty-icon">&#x1F3D7;&#xFE0F;</div><div class="empty-title">No features yet</div><div>Click &ldquo;+ New Feature&rdquo; to get started.</div>`;
                    root.appendChild(empty); return;
                }

                const sec = document.createElement("div"); sec.className = "section-header";
                sec.innerHTML = `<span class="section-label">Features</span>`; root.appendChild(sec);

                const grid = document.createElement("div"); grid.className = "feature-grid";
                for (const feature of features) {
                    const isActive = !!feature.isActive;
                    const outcomeCount = Number(feature.outcomeCount ?? 0);
                    const verifiedCount = Number(feature.verifiedOutcomeCount ?? 0);
                    const pct = outcomeCount > 0 ? Math.round((verifiedCount / outcomeCount) * 100) : 0;

                    const card = document.createElement("div"); card.className = "card" + (isActive ? " active-card" : "");
                    const row = document.createElement("div"); row.className = "card-row";
                    const body = document.createElement("div"); body.className = "card-body";
                    body.innerHTML = `<div class="card-id">${esc(feature.id)}</div><div class="card-title">${esc(feature.title || feature.id)}</div>`;
                    row.appendChild(body); row.appendChild(badge(isActive ? "active" : String(feature.status ?? "pending")));
                    card.appendChild(row);

                    if (outcomeCount > 0) {
                        const prog = document.createElement("div"); prog.className = "progress-wrap";
                        prog.innerHTML = `<div class="progress-label"><span>${verifiedCount}/${outcomeCount} outcomes verified</span><span>${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
                        card.appendChild(prog);
                    } else {
                        const meta = document.createElement("div"); meta.className = "card-meta"; meta.textContent = "No outcomes yet"; card.appendChild(meta);
                    }

                    const actions = document.createElement("div"); actions.className = "card-actions";
                    const openBtn = document.createElement("button"); openBtn.className = "btn btn-primary btn-sm";
                    openBtn.disabled = state.pendingFeatureId === feature.id || state.isSaving;
                    openBtn.textContent = state.pendingFeatureId === feature.id ? "Loading\u2026" : "Open";
                    openBtn.addEventListener("click", () => selectFeature(feature.id)); actions.appendChild(openBtn);

                    if (!isActive) {
                        const actBtn = document.createElement("button"); actBtn.className = "btn btn-sm";
                        actBtn.disabled = state.isActivating === feature.id || state.isSaving;
                        actBtn.textContent = state.isActivating === feature.id ? "Activating\u2026" : "Set Active";
                        actBtn.addEventListener("click", () => activateFeature(feature.id)); actions.appendChild(actBtn);
                    }
                    const editBtn = document.createElement("button"); editBtn.className = "btn btn-ghost btn-sm";
                    editBtn.disabled = state.isSaving; editBtn.textContent = "Edit";
                    editBtn.addEventListener("click", () => startFeatureEdit(feature.id)); actions.appendChild(editBtn);
                    appendActionButton(actions, { title: "Status", tool: "specrail_status" });
                    appendActionButton(actions, { title: "Trace", tool: "specrail_trace", args: { limit: 12 } });
                    card.appendChild(actions);

                    if (state.editingFeatureId === feature.id && state.featureDraft) {
                        const d = state.featureDraft;
                        card.appendChild(renderEditor(`Edit: ${feature.id}`, [
                            mkField("Title", "title", d.title, "feature"), mkField("Purpose", "purpose", d.purpose, "feature", true),
                            mkField("Outcomes (one per line)", "outcomes", d.outcomes, "feature", true),
                            mkField("Constraints (one per line)", "constraints", d.constraints, "feature", true),
                            mkField("Non-goals (one per line)", "non_goals", d.non_goals, "feature", true),
                            mkField("Dependencies (feature IDs, one per line)", "dependencies", d.dependencies, "feature", true),
                        ], saveFeatureEdit, cancelFeatureEdit));
                    }
                    grid.appendChild(card);
                }
                root.appendChild(grid);
            }

            function renderOutcomeSelection(data) {
                const selectedFeature = data.selectedFeature ?? {};
                const outcomes = Array.isArray(data.outcomes) ? data.outcomes : [];
                const featureId = data.selectedFeatureId ?? selectedFeature.id ?? "";
                const suggestedOrder = Number(data.suggestedNewOutcomeOrder ?? outcomes.length + 1);
                const root = document.getElementById("root"); root.innerHTML = "";

                const bc = document.createElement("div"); bc.className = "breadcrumb";
                const backLink = document.createElement("span"); backLink.className = "breadcrumb-item clickable";
                backLink.textContent = "Features"; backLink.addEventListener("click", returnToFeatures);
                bc.appendChild(backLink);
                bc.innerHTML += `<span class="breadcrumb-sep">\u203A</span><span class="breadcrumb-item">${esc(selectedFeature.title || featureId)}</span>`;
                root.appendChild(bc);

                const ha = document.getElementById("headerActions"); ha.innerHTML = "";
                const backBtn = document.createElement("button"); backBtn.className = "btn btn-ghost btn-sm";
                backBtn.textContent = "\u2190 Back"; backBtn.addEventListener("click", returnToFeatures); ha.appendChild(backBtn);
                if (!state.creatingOutcome) {
                    const newBtn = document.createElement("button"); newBtn.className = "btn btn-primary btn-sm";
                    newBtn.textContent = "+ New Outcome"; newBtn.disabled = state.isSaving;
                    newBtn.addEventListener("click", () => startNewOutcome(featureId, suggestedOrder)); ha.appendChild(newBtn);
                }

                renderToolOutput(root);

                const isActive = data.activeFeatureId === featureId;

                fBody.innerHTML = `<div class="card-id">${esc(featureId)}</div><div class="card-title">${esc(selectedFeature.title || featureId)}</div>`;
                fRow.appendChild(fBody); fRow.appendChild(badge(isActive ? "active" : String(selectedFeature.status ?? "pending")));
                fCard.appendChild(fRow);
                const fActions = document.createElement("div"); fActions.className = "card-actions";
                if (!isActive) {
                    const actBtn = document.createElement("button"); actBtn.className = "btn btn-sm";
                    actBtn.disabled = state.isActivating === featureId || state.isSaving;
                    actBtn.textContent = state.isActivating === featureId ? "Activating\u2026" : "Set Active";
                    actBtn.addEventListener("click", () => activateFeature(featureId)); fActions.appendChild(actBtn);
                }
                const feEditBtn = document.createElement("button"); feEditBtn.className = "btn btn-ghost btn-sm";
                feEditBtn.disabled = state.isSaving; feEditBtn.textContent = "Edit Feature";
                feEditBtn.addEventListener("click", () => startFeatureEdit(featureId)); fActions.appendChild(feEditBtn);
                appendActionButton(fActions, { title: "Feature Details", tool: "specrail_feature_show", args: { id: featureId } });
                appendActionButton(fActions, { title: "Feature Tests", tool: "specrail_test_list", args: { feature_id: featureId } });
                appendActionButton(fActions, { title: "Status", tool: "specrail_status" });
                appendActionButton(fActions, { title: "Trace", tool: "specrail_trace", args: { limit: 12 } });
                fCard.appendChild(fActions);
                if (state.editingFeatureId === featureId && state.featureDraft) {
                    const d = state.featureDraft;
                    fCard.appendChild(renderEditor(`Edit: ${featureId}`, [
                        mkField("Title", "title", d.title, "feature"), mkField("Purpose", "purpose", d.purpose, "feature", true),
                        mkField("Outcomes (one per line)", "outcomes", d.outcomes, "feature", true),
                        mkField("Constraints (one per line)", "constraints", d.constraints, "feature", true),
                        mkField("Non-goals (one per line)", "non_goals", d.non_goals, "feature", true),
                        mkField("Dependencies (feature IDs, one per line)", "dependencies", d.dependencies, "feature", true),
                    ], saveFeatureEdit, cancelFeatureEdit));
                }
                root.appendChild(fCard);

                if (state.creatingOutcome && state.newOutcomeDraft) {
                    const d = state.newOutcomeDraft;

                        mkField("Order", "order", d.order, "newOutcome"),
                        mkField("Allowed paths (one glob per line)", "allowed_paths", d.allowed_paths, "newOutcome", true),

                    root.appendChild(empty); return;

                if (outcomes.length > 0) {

                    const sec = document.createElement("div"); sec.className = "section-header";

                    root.appendChild(sec);

                    const list = document.createElement("ul"); list.className = "outcome-list";
                    for (const outcome of outcomes) {
                        const isActiveOutcome = !!outcome.isActive;
                        const item = document.createElement("li");
                        let cls = "outcome-item";
                        if (isActiveOutcome) cls += " active-outcome";
                        if (outcome.status === "verified") cls += " verified-outcome";
                        if (outcome.status === "failed") cls += " failed-outcome";
                        item.className = cls;

                        const row = document.createElement("div"); row.className = "outcome-row";
                        const body = document.createElement("div"); body.className = "outcome-body";
                        body.innerHTML = `<div class="outcome-num">Outcome ${esc(outcome.order ?? "?")}</div><div class="outcome-title">${esc(outcome.title || outcome.id)}</div><div class="outcome-id">${esc(outcome.id)}</div>`;

                        const testCount = Number(outcome.testCount ?? 0);
                        const passingCount = Number(outcome.passingTestCount ?? 0);

                        if (["verified", "failed", "skipped"].includes(String(outcome.status ?? ""))) {
                            appendActionButton(actions, {
                                title: "Unverify",
                                tool: "specrail_outcome_unverify",
                                args: { feature_id: featureId, outcome_id: outcome.id },
                                refresh: true,
                                successMessage: `Outcome reset to pending: ${outcome.id}`,
                            });
                        }
                        const gapBtn = document.createElement("button"); gapBtn.className = "btn btn-sm";
                        gapBtn.disabled = state.isSaving || state.runningAction === `gap-check:${featureId}:${outcome.id}`;
                        gapBtn.textContent = state.runningAction === `gap-check:${featureId}:${outcome.id}` ? "Checking Gaps\u2026" : "Check Test Gaps";
                        gapBtn.addEventListener("click", () => checkOutcomeTestGaps(featureId, outcome.id)); actions.appendChild(gapBtn);
                        appendActionButton(actions, { title: "Tests", tool: "specrail_test_list", args: { feature_id: featureId, outcome_id: outcome.id } });
                        appendActionButton(actions, { title: "Details", tool: "specrail_outcome_show", args: { feature_id: featureId, outcome_id: outcome.id } });
                        const editBtn = document.createElement("button"); editBtn.className = "btn btn-ghost btn-sm";
                        editBtn.disabled = state.isSaving; editBtn.textContent = "Edit";
                        editBtn.addEventListener("click", () => startOutcomeEdit(featureId, outcome.id)); actions.appendChild(editBtn);
                        item.appendChild(actions);

                        if (state.editingOutcomeId === outcome.id && state.outcomeDraft) {
                            const d = state.outcomeDraft;
                            item.appendChild(renderEditor(`Edit: ${outcome.id}`, [
                                mkField("Title", "title", d.title, "outcome"), mkField("Goal", "goal", d.goal, "outcome", true),
                                mkField("Order", "order", d.order, "outcome"),
                                mkField("Prerequisites (one outcome ID per line)", "prerequisites", d.prerequisites, "outcome", true),
                                mkField("Allowed paths (one glob per line)", "allowed_paths", d.allowed_paths, "outcome", true),
                                mkField("Forbidden paths (one glob per line)", "forbidden_paths", d.forbidden_paths, "outcome", true),
                                mkField("Required tests (one path/ID per line)", "required_tests", d.required_tests, "outcome", true),
                            ], saveOutcomeEdit, cancelOutcomeEdit));
                        }
                        list.appendChild(item);
                    }
                    root.appendChild(list);
                }
            }

            function render() {
                applyHostStyles();
                const result = state.toolResult;
                const data = (result?.structuredContent && typeof result.structuredContent === "object") ? result.structuredContent : {};
                if (!result) {
                    document.getElementById("root").innerHTML = `<div class="empty"><div class="empty-icon">&#x1F682;</div><div class="empty-title">Specrail</div><div>Waiting for data\u2026</div></div>`;
                    document.getElementById("headerActions").innerHTML = ""; return;
                }
                if (result.isError) {
                    document.getElementById("root").innerHTML = `<div class="empty"><div class="empty-icon">\u26A0\uFE0F</div><div class="empty-title">Tool error</div><div>${esc(toolText(result) || "The MCP tool returned an error.")}</div></div>`;
                    document.getElementById("headerActions").innerHTML = "";
                    showStatus(toolText(result), "error"); return;
                }
                if (data.mode === "outcome_selection") renderOutcomeSelection(data);
                else renderFeatureSelection(data);
                reportSize();
            }

            function reportSize() {
                sendNotification("ui/notifications/size-changed", {
                    width: Math.ceil(document.documentElement.scrollWidth || document.body.scrollWidth || 0),
                    height: Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight || 0),
                });
            }

            window.addEventListener("message", event => {
                const msg = event.data;
                if (!msg || msg.jsonrpc !== "2.0") return;
                if (typeof msg.id !== "undefined" && pending.has(msg.id)) {
                    const req = pending.get(msg.id); pending.delete(msg.id);
                    if (Object.prototype.hasOwnProperty.call(msg, "result")) req.resolve(msg.result);
                    else req.reject(new Error(msg?.error?.message ?? "Unknown error"));
                    return;
                }
                if (msg.method === "ui/resource-teardown" && typeof msg.id !== "undefined") { sendResponse(msg.id, {}); return; }
                if (msg.method === "ui/notifications/tool-input") {
                    state.toolArguments = (msg.params?.arguments && typeof msg.params.arguments === "object") ? msg.params.arguments : {}; return;
                }
                if (msg.method === "ui/notifications/tool-result") { state.toolResult = msg.params; render(); reportSize(); return; }
                if (msg.method === "ui/notifications/tool-cancelled") { showStatus(msg.params?.reason ?? "Cancelled.", "error"); return; }
                if (msg.method === "ui/notifications/host-context-changed") { state.hostContext = merge(state.hostContext, msg.params ?? {}); render(); }
            });

            new ResizeObserver(() => reportSize()).observe(document.body);

            (async () => {
                try {
                    const init = await sendRequest("ui/initialize", {
                        protocolVersion: "2026-01-26",
                        clientInfo: { name: "specrail-navigator", version: "2.0.0" },
                        capabilities: {}, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
                    });
                    state.hostContext = (init?.hostContext && typeof init.hostContext === "object") ? init.hostContext : {};
                    applyHostStyles(); sendNotification("ui/notifications/initialized", {}); render(); reportSize();
                } catch (e) { showStatus(e?.message ?? String(e), "error"); }
            })();
        })();
    </script>
</body>

</html>

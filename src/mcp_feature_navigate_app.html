            function getOutcomeReview(outcome) {
                return outcome && outcome.testReview && typeof outcome.testReview === "object" ? outcome.testReview : null;
            }

            function requiredTestNamesFromReview(requiredIds, review) {
                var byId = {};
                if (review && Array.isArray(review.related_tests)) {
                    review.related_tests.forEach(function (test) {
                        var id = String((test && test.id) || "").trim();
                        if (!id) return;
                        byId[id] = String((test && test.name) || "").trim();
                    });
                }
                return (Array.isArray(requiredIds) ? requiredIds : []).map(function (id) {
                    return byId[String(id)] || "";
                });
            }

            function currentOutcomeReview(featureId, outcomeId) {
                var sc = state.toolResult && state.toolResult.structuredContent;
                var outcomes = Array.isArray(sc && sc.outcomes) ? sc.outcomes : [];
                var found = outcomes.find(function (outcome) {
                    return String((outcome && outcome.id) || "") === String(outcomeId || "");
                });
                if (!found) return null;
                return getOutcomeReview(found);
            }

            function reviewSummary(review) {
                if (!review) return { tone: "muted", text: "Test health is not available for this outcome yet." };
                if (review.has_no_required_tests) return { tone: "warn", text: "Add required test IDs to make this outcome verifiable." };
                if (review.has_no_required_test_files) return { tone: "warn", text: "Add required test file paths to make this outcome verifiable." };
                if (review.has_no_related_tests) return { tone: "warn", text: "No manifest tests are linked to this outcome yet." };
                if (review.missing_required_tests.length > 0) return { tone: "warn", text: review.missing_required_tests.length + " required test ID" + (review.missing_required_tests.length !== 1 ? "s are" : " is") + " still missing from the manifest." };
                if (review.missing_required_test_files.length > 0) return { tone: "warn", text: review.missing_required_test_files.length + " required test file path" + (review.missing_required_test_files.length !== 1 ? "s are" : " is") + " still missing from the manifest." };
                if (review.planned_required_tests.length > 0) return { tone: "warn", text: review.planned_required_tests.length + " required test" + (review.planned_required_tests.length !== 1 ? "s remain" : " remains") + " in planned status." };
                if (review.planned_required_test_files.length > 0) return { tone: "warn", text: review.planned_required_test_files.length + " required test file" + (review.planned_required_test_files.length !== 1 ? "s remain" : " remains") + " in planned status." };
                return { tone: "success", text: "Required tests are linked and ready to drive implementation." };
            }

            function testStatusChipClass(status) {
                return status === "passing" ? "passing"
                    : status === "planned" ? "warning"
                        : status === "failing" ? "danger"
                            : "";
            }

            function appendTestChip(container, label, tone) {
                var chip = document.createElement("span");
                chip.className = "test-chip" + (tone ? " " + tone : "");
                chip.textContent = label;
                container.appendChild(chip);
            }

            function testFileName(path) {
                var parts = String(path || "").split("/");
                return parts[parts.length - 1] || String(path || "");
            }

            function testDisplayName(test) {
                var fileName = testFileName(test && test.path);
                var methodName = String((test && test.name) || "").trim() || String((test && test.id) || "unnamed-test");
                return fileName === methodName ? fileName : (fileName + " :: " + methodName);
            }

            function isUndeclaredRelatedTest(review, test) {
                if (!review || !Array.isArray(review.undeclared_tests) || !test) return false;
                return review.undeclared_tests.some(function (candidate) {
                    return String(candidate.path || "") === String(test.path || "")
                        && String(candidate.id || "") === String(test.id || "");
                });
            }

            function renderPathList(paths, className) {
                var list = document.createElement("ul");
                list.className = className || "path-list";
                paths.forEach(function (path) {
                    var item = document.createElement("li");
                    item.textContent = path;
                    list.appendChild(item);
                });
                return list;
            }

            function fileOpenStateKey(path) {
                return panelStateKey("open-file", path);
            }

            function getFileOpenState(path) {
                return state.fileOpenStates[fileOpenStateKey(path)] || null;
            }

            function setFileOpenState(path, status, message) {
                state.fileOpenStates[fileOpenStateKey(path)] = { status: status, message: message };
            }

            async function requestOpenRelatedTest(path) {
                var params = {
                    path: path,
                    cwd: state.toolArguments && state.toolArguments.cwd ? state.toolArguments.cwd : null,
                };

                setFileOpenState(path, "pending", "Awaiting host acknowledgement for the file-open request.");
                render();

                try {
                    var result = await sendRequestWithTimeout("ui/requests/open-file", params, 2500);
                    if (result && result.opened === false) {
                        throw new Error(result.message || "Host declined the file-open request.");
                    }

                    setFileOpenState(path, "opened", "Host acknowledged the file-open request.");
                    appendLog("Host acknowledged file open: " + path, "success");
                } catch (e) {
                    sendNotification("ui/notifications/open-file", params);
                    setFileOpenState(path, "fallback", "No acknowledgement received. Sent a best-effort open notification; keep using the inline test panel if nothing opens.");
                    appendLog("No host acknowledgement for file open: " + path + ". Sent fallback notification.", "warn");
                }

                render();
            }

            function suggestionPreviewKey(featureId, outcomeId) {
                return panelStateKey("ai-suggestions", featureId, outcomeId);
            }

            function implementationDelegationKey(featureId, outcomeId) {
                return panelStateKey("implementation-delegation", featureId || "", outcomeId || "*");
            }

            function getImplementationDelegation(featureId, outcomeId) {
                return state.implementationDelegations[implementationDelegationKey(featureId, outcomeId)] || null;
            }

            function setImplementationDelegation(featureId, outcomeId, payload) {
                state.implementationDelegations[implementationDelegationKey(featureId, outcomeId)] = payload;
            }

            function rememberImplementationDelegation(result, args) {
                var sc = result && result.structuredContent;
                if (!sc || typeof sc !== "object") return false;

                if (sc.delegation && typeof sc.delegation === "object") {
                    var delegation = sc.delegation;
                    setImplementationDelegation(
                        delegation.feature_id || args.feature_id || "",
                        delegation.outcome_id || "",
                        {
                            kind: "single",
                            message: toolText(result),
                            instructions: sc.instructions || null,
                            delegation: delegation,
                        }
                    );
                    return true;
                }

                if (Array.isArray(sc.delegations) && sc.delegations.length > 0) {
                    var featureId = sc.feature_id || args.feature_id || sc.delegations[0].feature_id || "";
                    setImplementationDelegation(featureId, "*", {
                        kind: "feature",
                        message: toolText(result),
                        instructions: sc.instructions || null,
                        delegations: sc.delegations,
                        blocked: Array.isArray(sc.blocked) ? sc.blocked : [],
                    });

                    sc.delegations.forEach(function (delegation) {
                        if (!delegation || typeof delegation !== "object") return;
                        setImplementationDelegation(featureId, delegation.outcome_id || "", {
                            kind: "single",
                            message: toolText(result),
                            instructions: sc.instructions || null,
                            delegation: delegation,
                        });
                    });
                    return true;
                }

                return false;
            }

            async function copyTextToClipboard(text, successMessage) {
                var value = String(text == null ? "" : text);
                if (!value) {
                    appendLog("Nothing to copy.", "warn");
                    return;
                }

                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(value);
                    } else {
                        var input = document.createElement("textarea");
                        input.value = value;
                        input.setAttribute("readonly", "readonly");
                        input.style.position = "fixed";
                        input.style.opacity = "0";
                        document.body.appendChild(input);
                        input.focus();
                        input.select();
                        var copied = document.execCommand && document.execCommand("copy");
                        document.body.removeChild(input);
                        if (!copied) throw new Error("Clipboard copy is unavailable in this host.");
                    }

                    appendLog(successMessage || "Copied to clipboard.", "success");
                } catch (e) {
                    appendLog("Copy failed: " + (e && e.message ? e.message : String(e)), "warn");
                }
            }

            function buildCommandUri(commandId, args) {
                if (!commandId) return "";
                var encodedArgs = encodeURIComponent(JSON.stringify(Array.isArray(args) ? args : []));
                return "command:" + commandId + (encodedArgs ? ("?" + encodedArgs) : "");
            }

            function invokeCommandUri(commandId, args) {
                var href = buildCommandUri(commandId, args);
                if (!href) return false;
                try {
                    var link = document.createElement("a");
                    link.href = href;
                    link.style.display = "none";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    return true;
                } catch (e) {
                    return false;
                }
            }

            async function startChatForDelegation(delegation) {
                if (!delegation || typeof delegation !== "object") return { opened: false, copied: false };

                var prompt = String(delegation.prompt || "");
                var copied = false;
                if (prompt) {
                    try {
                        await copyTextToClipboard(prompt, "Implementation prompt copied to clipboard.");
                        copied = true;
                    } catch (_) { }
                }

                if (invokeCommandUri("workbench.action.chat.open", [{ query: prompt, isPartialQuery: false }])) {
                    appendLog("Opened chat with the implementation prompt. Review and submit it in chat if the host did not auto-run it.", "success");
                    return { opened: true, copied: copied, method: "command-uri:workbench.action.chat.open" };
                }

                if (invokeCommandUri("workbench.action.chat.open", [])) {
                    appendLog("Opened chat without a prefilled prompt. Paste the copied implementation prompt into chat.", "warn");
                    return { opened: true, copied: copied, method: "command-uri:workbench.action.chat.open-empty" };
                }

                appendLog("Chat handoff unavailable from this host. Use the copied prompt or the implementation prompt panel below.", "warn");
                return { opened: false, copied: copied };
            }

            function getSuggestionPreview(featureId, outcomeId) {
                return state.suggestionPreviews[suggestionPreviewKey(featureId, outcomeId)] || null;
            }

            function getSuggestionPreviewError(featureId, outcomeId) {
                return state.suggestionPreviewErrors[suggestionPreviewKey(featureId, outcomeId)] || null;
            }

            async function previewOutcomeSuggestions(featureId, outcomeId) {
                var actionKey = "test-suggest:" + featureId + ":" + outcomeId;
                state.runningAction = actionKey;
                delete state.suggestionPreviewErrors[suggestionPreviewKey(featureId, outcomeId)];
                appendLog("Previewing AI test suggestions for: " + outcomeId, "action");
                render();
                try {
                    var result = await callTool("specrail_test_suggest", Object.assign({}, state.toolArguments, {
                        feature_id: featureId,
                        outcome_id: outcomeId,
                    }));
                    if (result && result.isError) {
                        throw new Error(toolText(result) || "Suggestion preview failed.");
                    }

                    var preview = result && result.structuredContent && result.structuredContent.preview;
                    state.suggestionPreviews[suggestionPreviewKey(featureId, outcomeId)] = preview || null;
                    appendLog("AI preview ready for: " + outcomeId, "success");
                } catch (e) {
                    state.suggestionPreviewErrors[suggestionPreviewKey(featureId, outcomeId)] = e && e.message ? e.message : String(e);
                    appendLog("AI preview failed for " + outcomeId + ": " + (e && e.message ? e.message : String(e)), "error");
                }
                state.runningAction = null;
                render();
            }

            function renderSuggestionPreview(featureId, outcomeId) {
                var preview = getSuggestionPreview(featureId, outcomeId);
                var previewError = getSuggestionPreviewError(featureId, outcomeId);
                if (!preview && !previewError) return null;

                var section = document.createElement("div");
                section.className = "section-card";

                var head = document.createElement("div");
                head.className = "section-card-head";
                head.innerHTML = '<span class="section-card-title">AI preview suggestions</span>';
                var previewBadge = badge(preview && preview.exact_path_match ? "verified" : "failed");
                previewBadge.textContent = preview && preview.exact_path_match ? "\u2713 Match" : "\u26A0 Review";
                head.appendChild(previewBadge);
                section.appendChild(head);

                var copy = document.createElement("div");
                copy.className = "section-card-copy";
                if (previewError) {
                    copy.textContent = previewError;
                    section.appendChild(copy);
                    return section;
                }

                copy.textContent = "Preview only. These suggestions did not write files or update the manifest.";
                section.appendChild(copy);

                var chips = document.createElement("div");
                chips.className = "test-chips";
                appendTestChip(chips, preview.suggestions.length + " suggestion" + (preview.suggestions.length !== 1 ? "s" : ""), "");
                if (preview.missing_expected_paths.length > 0) appendTestChip(chips, preview.missing_expected_paths.length + " missing", "danger");
                if (preview.unexpected_paths.length > 0) appendTestChip(chips, preview.unexpected_paths.length + " unexpected", "warning");
                section.appendChild(chips);

                if (Array.isArray(preview.suggestions) && preview.suggestions.length > 0) {
                    var list = document.createElement("ul");
                    list.className = "suggestion-preview-list";
                    preview.suggestions.forEach(function (suggestion) {
                        var item = document.createElement("li");
                        item.className = "suggestion-preview-item";
                        item.innerHTML =
                            '<div class="suggestion-preview-path">' + esc(suggestion.path) + '</div>' +
                            '<div class="related-test-meta"></div>' +
                            '<div class="suggestion-preview-copy">' + esc(suggestion.content_preview || "No content preview available.") + '</div>';
                        var meta = item.querySelector(".related-test-meta");
                        appendTestChip(meta, String(suggestion.kind || "unit"), "");
                        appendTestChip(meta, String(suggestion.content_line_count || 0) + " lines", "");
                        list.appendChild(item);
                    });
                    section.appendChild(list);
                }

                if (preview.missing_expected_paths.length > 0) {
                    var missingTitle = document.createElement("div");
                    missingTitle.className = "card-note";
                    missingTitle.textContent = "Still missing from the AI preview";
                    section.appendChild(missingTitle);
                    section.appendChild(renderPathList(preview.missing_expected_paths, "path-list"));
                }

                if (preview.unexpected_paths.length > 0) {
                    var unexpectedTitle = document.createElement("div");
                    unexpectedTitle.className = "card-note";
                    unexpectedTitle.textContent = "Unexpected preview paths";
                    section.appendChild(unexpectedTitle);
                    section.appendChild(renderPathList(preview.unexpected_paths, "path-list"));
                }

                var note = document.createElement("div");
                note.className = "suggestion-preview-note";
                note.textContent = "Agent: " + esc(preview.agent || "unknown") + " • Scope: " + esc(preview.scope_label || (featureId + ":" + outcomeId));
                section.appendChild(note);
                return section;
            }

            function renderTestHealthSection(featureId, outcome, isActiveOutcome) {
                var review = getOutcomeReview(outcome);
                if (!review) return null;

                var summary = reviewSummary(review);
                var section = document.createElement("div");
                section.className = "section-card";

                var head = document.createElement("div");
                head.className = "section-card-head";
                head.innerHTML = '<span class="section-card-title">Test health</span>';
                var healthBadge = badge(review.has_gaps ? "failed" : "verified");
                healthBadge.textContent = review.has_gaps ? "\u26A0 Gaps" : "\u2713 Ready";
                head.appendChild(healthBadge);
                section.appendChild(head);

                var copy = document.createElement("div");
                copy.className = "section-card-copy";
                copy.textContent = summary.text;
                section.appendChild(copy);

                var chips = document.createElement("div");
                chips.className = "test-chips";
                appendTestChip(chips, review.related_test_count + " linked", "");
                appendTestChip(chips, review.required_test_count + " required ids", "");
                appendTestChip(chips, review.required_test_file_count + " required files", "");
                if (review.missing_required_tests.length > 0) appendTestChip(chips, review.missing_required_tests.length + " missing", "danger");
                if (review.missing_required_test_files.length > 0) appendTestChip(chips, review.missing_required_test_files.length + " file missing", "danger");
                if (review.planned_required_tests.length > 0) appendTestChip(chips, review.planned_required_tests.length + " planned", "warning");
                if (review.planned_required_test_files.length > 0) appendTestChip(chips, review.planned_required_test_files.length + " file planned", "warning");
                if (review.undeclared_tests.length > 0) appendTestChip(chips, review.undeclared_tests.length + " undeclared", "warning");
                section.appendChild(chips);

                if (review.suggested_test_paths.length > 0) {
                    var suggestionTitle = document.createElement("div");
                    suggestionTitle.className = "card-note";
                    suggestionTitle.textContent = "Suggested next tests";
                    section.appendChild(suggestionTitle);
                    section.appendChild(renderPathList(review.suggested_test_paths, "suggestion-list"));

                if (review.required_test_ids.length > 0 && review.suggested_test_paths.length === 0 && review.related_test_count === 0) {
                    var requiredTitle = document.createElement("div");
                    requiredTitle.className = "card-note";
                    requiredTitle.textContent = "Required test IDs";
                    section.appendChild(requiredTitle);
                    section.appendChild(renderPathList(review.required_test_ids, "path-list"));
                }

                if (review.required_test_files.length > 0 && review.suggested_test_paths.length === 0 && review.related_test_count === 0) {

                    requiredFilesTitle.className = "card-note";
                    requiredFilesTitle.textContent = "Required test files";
                    section.appendChild(requiredFilesTitle);
                    section.appendChild(renderPathList(review.required_test_files, "path-list"));
                }

                var actionRow = document.createElement("div");
                actionRow.className = "inline-actions";
                var suggestionActionKey = "test-suggest:" + featureId + ":" + outcome.id;
                if (review.required_test_count > 0 && review.has_gaps) {
                    var previewBtn = document.createElement("button");
                    previewBtn.className = "btn btn-sm";
                    previewBtn.disabled = state.isSaving || state.runningAction === suggestionActionKey;
                    previewBtn.textContent = state.runningAction === suggestionActionKey
                        ? "Previewing AI Suggestions…"
                        : (getSuggestionPreview(featureId, outcome.id) ? "Refresh AI Suggestions" : "Preview AI Suggestions");

                        ev.preventDefault();
                        ev.stopPropagation();
                        previewOutcomeSuggestions(featureId, outcome.id);

                if (review.has_no_required_tests || review.has_no_required_test_files) {

                        kind: "primary",

                    });

                    addRequiredBtn.className = "btn btn-sm";
                    addRequiredBtn.disabled = state.isSaving;
                    addRequiredBtn.textContent = "Add Required Tests";

                        ev.preventDefault();
                        ev.stopPropagation();
                        startOutcomeEdit(featureId, outcome.id);

                if (review.needs_generation) {
                    appendActionButton(actionRow, {
                        title: "Generate Missing Tests",
                        tool: "specrail_test_generate",
                        args: { feature_id: featureId, outcome_id: outcome.id },
                        kind: "primary",
                        refresh: true
                    });
                }

                if (actionRow.childNodes.length > 0) {
                    section.appendChild(actionRow);
                }

                return section;
            }

            function renderImplementationDelegationSection(featureId, outcomeId) {

                var delegation = payload.delegation;
                var section = document.createElement("div");
                section.className = "section-card";

                var head = document.createElement("div");
                head.className = "section-card-head";
                head.innerHTML = '<span class="section-card-title">Implementation prompt ready</span>';
                var readyBadge = badge("active");
                readyBadge.textContent = "Ready";
                head.appendChild(readyBadge);
                section.appendChild(head);

                var copy = document.createElement("div");
                copy.className = "section-card-copy";
                copy.textContent = payload.message
                    || "The navigator prepared an implementation prompt for chat. It does not execute automatically in the current shell from this embedded view.";
                section.appendChild(copy);

                var chips = document.createElement("div");

            function mkField(label, key, value, target, multiline, hint) {
                var lbl = document.createElement("label");
                lbl.innerHTML = '<span>' + esc(label) + '</span>';
                var inp = document.createElement(multiline ? "textarea" : "input");
                if (!multiline) inp.type = key === "order" ? "number" : "text";
                if (key === "order") inp.min = "1";
                inp.value = value || "";
                inp.addEventListener("input", function (ev) {
                    var v = ev.target.value;
                    if (target === "feature" && state.featureDraft) state.featureDraft[key] = v;
                    if (target === "outcome" && state.outcomeDraft) state.outcomeDraft[key] = v;
                    if (target === "newFeature" && state.newFeatureDraft) state.newFeatureDraft[key] = v;
                    if (target === "newOutcome" && state.newOutcomeDraft) state.newOutcomeDraft[key] = v;
                });
                lbl.appendChild(inp);
                if (hint) { var p = document.createElement("p"); p.className = "field-hint"; p.textContent = hint; lbl.appendChild(p); }
                return lbl;
            }

            function appendFeatureTestProgress(container, feature) {
                var totalTestCount = Number(feature.totalTestCount || 0);
                var passingTestCount = Number(feature.passingTestCount || 0);
                var writtenTestCount = Number(feature.writtenTestCount || 0);
                var plannedTestCount = Number(feature.plannedTestCount || 0);
                var failingTestCount = Number(feature.failingTestCount || 0);
                var undeclaredOutcomeCount = Number(feature.undeclaredOutcomeCount || 0);

                if (totalTestCount <= 0 && undeclaredOutcomeCount <= 0) {
                    return;
                }

                var wrap = document.createElement("div");
                wrap.className = "progress-wrap";

                var label = document.createElement("div");
                label.className = "progress-label";
                if (totalTestCount > 0) {
                    label.innerHTML = '<span>' + passingTestCount + '/' + totalTestCount + ' tests passing</span><span>' + Math.round((passingTestCount / totalTestCount) * 100) + '%</span>';
                } else {
                    label.innerHTML = '<span>No linked tests yet</span><span>0%</span>';
                }
                wrap.appendChild(label);

                var bar = document.createElement("div");
                bar.className = "progress-bar";

                if (totalTestCount > 0) {
                    [
                        { count: passingTestCount, className: "passing" },
                        { count: writtenTestCount, className: "written" },
                        { count: plannedTestCount, className: "planned" },
                        { count: failingTestCount, className: "failing" },
                    ].forEach(function (segment) {
                        if (segment.count <= 0) return;
                        var fill = document.createElement("div");
                        fill.className = "progress-fill " + segment.className;
                        fill.style.width = ((segment.count / totalTestCount) * 100) + "%";
                        bar.appendChild(fill);
                    });
                }

                wrap.appendChild(bar);

                var chips = document.createElement("div");
                chips.className = "test-chips";
                if (passingTestCount > 0) appendTestChip(chips, passingTestCount + " passing", "passing");
                if (writtenTestCount > 0) appendTestChip(chips, writtenTestCount + " written", "");
                if (plannedTestCount > 0) appendTestChip(chips, plannedTestCount + " planned", "warning");
                if (failingTestCount > 0) appendTestChip(chips, failingTestCount + " failing", "danger");
                if (undeclaredOutcomeCount > 0) appendTestChip(chips, undeclaredOutcomeCount + " outcome" + (undeclaredOutcomeCount !== 1 ? "s" : "") + " with undeclared tests", "warning");
                if (chips.childNodes.length > 0) {
                    wrap.appendChild(chips);
                }

                container.appendChild(wrap);
            }

            function renderFeatureSelection(data) {
                var features = Array.isArray(data.features) ? data.features : [];

                var components = Array.isArray(data.components) ? data.components : [];

                                            tooltip: hasTestGaps
                                                ? "Review this outcome's tests and resolve readiness gaps before verification."
                                                : !canVerify
                                                    ? "Run implement successfully before verification becomes relevant."
                                                    : verifyStatus.detail
                                        });
                                    }
                                    if (outcomeAvailableAction(outcome, "advance")) {
                                        appendActionButton(actions, { title: "Advance To Next Outcome", tool: advanceTool, args: {}, kind: "success", refresh: true });
                                    }
                                }

                                if (outcomeAvailableAction(outcome, "unverify")) {
                                    appendActionButton(actions, {
                                        title: "Reset Status",
                                        tool: unverifyOutcomeTool,
                                        args: { feature_id: featureId, outcome_id: outcome.id },
                                        kind: "danger",
                                        refresh: true,
                                    });
                                }

                                var editBtn = document.createElement("button"); editBtn.className = "btn btn-ghost btn-sm";
                                editBtn.disabled = state.isSaving; editBtn.textContent = "Edit Outcome";
                                (function (fid, oid) {
                                    editBtn.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); startOutcomeEdit(fid, oid); });
                                })(featureId, outcome.id);
                                actions.appendChild(editBtn);
                                content.appendChild(actions);

                                var outcomeMeta = document.createElement("div");
                                outcomeMeta.className = "card-note";
                                outcomeMeta.textContent = outcome.goal || "No outcome goal recorded.";
                                content.appendChild(outcomeMeta);

                                var healthSection = renderTestHealthSection(featureId, outcome, isActiveOutcome);
                                if (healthSection) content.appendChild(healthSection);

                                var implementationDelegationSection = renderImplementationDelegationSection(featureId, outcome.id);
                                if (implementationDelegationSection) content.appendChild(implementationDelegationSection);

                                var suggestionPreviewSection = renderSuggestionPreview(featureId, outcome.id);
                                if (suggestionPreviewSection) content.appendChild(suggestionPreviewSection);

                                var relatedTestsSection = renderRelatedTestsSection(featureId, outcome);
                                if (relatedTestsSection) content.appendChild(relatedTestsSection);

                                if (state.editingOutcomeId === outcome.id && state.outcomeDraft) {
                                    var d = state.outcomeDraft;
                                    content.appendChild(renderEditor("Edit: " + outcome.id, [
                                        mkField("Title", "title", d.title, "outcome"),
                                        mkField("Goal", "goal", d.goal, "outcome", true),
                                        mkField("Order", "order", d.order, "outcome"),
                                        mkField("Prerequisites (one outcome ID per line)", "prerequisites", d.prerequisites, "outcome", true),
                                        mkField("Allowed paths (one glob per line)", "allowed_paths", d.allowed_paths, "outcome", true),
                                        mkField("Forbidden paths (one glob per line)", "forbidden_paths", d.forbidden_paths, "outcome", true),
                                        mkField("Required test IDs (one per line)", "required_tests", d.required_tests, "outcome", true),
                                        mkField("Required test names (one per line)", "required_test_names", d.required_test_names, "outcome", true),
                                        mkField("Required test files (one path per line)", "required_test_files", d.required_test_files, "outcome", true),
                                    ], saveOutcomeEdit, cancelOutcomeEdit));
                                }
                            },
                        });
                        var li = document.createElement("li"); li.appendChild(item); list.appendChild(li);
                    });
                    root.appendChild(list);
                }
            }

            // Main render
            function applyHostStyles() {
                var root = document.documentElement;
                var vars = state.hostContext && state.hostContext.styles && state.hostContext.styles.variables;
                if (vars && typeof vars === "object")
                    Object.entries(vars).forEach(function (kv) { if (typeof kv[1] === "string") root.style.setProperty(kv[0], kv[1]); });
                var theme = state.hostContext && state.hostContext.theme;
                if (theme === "dark" || theme === "light") root.style.colorScheme = theme;
            }

            function render() {
                applyHostStyles();
                var bcBar = document.getElementById("breadcrumbBar");
                if (bcBar) bcBar.innerHTML = "";

                var result = state.toolResult;
                var data = (result && result.structuredContent && typeof result.structuredContent === "object") ? result.structuredContent : {};

                if (!result) {
                    document.getElementById("root").innerHTML = '<div class="empty"><div class="empty-icon">\u{1F682}</div><div class="empty-title">Specrail</div><div>Waiting for data\u2026</div></div>';
                    document.getElementById("headerActions").innerHTML = "";
                    renderWorkflowBar({}); return;
                }

                if (result.isError) {
                    document.getElementById("root").innerHTML = '<div class="empty"><div class="empty-icon">\u26A0\uFE0F</div><div class="empty-title">Error</div><div>' + esc(toolText(result) || "The MCP tool returned an error.") + '</div></div>';
                    document.getElementById("headerActions").innerHTML = "";
                    appendLog("Tool error: " + toolText(result), "error"); return;
                }

                renderWorkflowBar(data);
                if (data.mode === "outcome_selection") renderOutcomeSelection(data);
                else renderFeatureSelection(data);
                reportSize();
            }

            function reportSize() {
                var appBody = document.getElementById("root");
                var headerEl = document.querySelector(".app-header");
                var statusEl = document.getElementById("appStatusBar");
                var headerH = headerEl ? headerEl.offsetHeight : 0;
                var statusH = statusEl ? statusEl.offsetHeight : 0;
                // .app-body has padding: 16px top + 18px bottom (34px total) — keep in sync with CSS
                var bodyPad = 16 + 18;
                var contentH = appBody ? appBody.scrollHeight : 600;
                var needed = headerH + contentH + statusH + bodyPad;
                var h = Math.max(320, Math.min(900, needed));
                var appEl = document.querySelector(".app");
                if (appEl) appEl.style.height = h + "px";
                sendNotification("ui/notifications/size-changed", { width: 680, height: h });
            }

            window.addEventListener("message", function (event) {
                var msg = event.data;
                if (!msg || msg.jsonrpc !== "2.0") return;
                if (typeof msg.id !== "undefined" && pending.has(msg.id)) {
                    var req = pending.get(msg.id); pending.delete(msg.id);
                    if (Object.prototype.hasOwnProperty.call(msg, "result")) req.resolve(msg.result);
                    else req.reject(new Error((msg.error && msg.error.message) || "Unknown error"));
                    return;
                }
                if (msg.method === "ui/resource-teardown" && typeof msg.id !== "undefined") { sendResponse(msg.id, {}); return; }
                if (msg.method === "ui/notifications/tool-input") {
                    state.toolArguments = (msg.params && msg.params.arguments && typeof msg.params.arguments === "object") ? msg.params.arguments : {};
                    return;
                }
                if (msg.method === "ui/notifications/tool-result") { state.toolResult = msg.params; render(); reportSize(); return; }
                if (msg.method === "ui/notifications/tool-cancelled") { appendLog("Cancelled: " + ((msg.params && msg.params.reason) || "Operation was cancelled."), "warn"); return; }
                if (msg.method === "ui/notifications/open-file-result") {
                    var path = msg.params && msg.params.path;
                    if (path) {
                        if (msg.params.opened === true) {
                            setFileOpenState(path, "opened", (msg.params.message || "Host acknowledged the file-open request."));
                            appendLog("Host acknowledged file open: " + path, "success");
                        } else {
                            setFileOpenState(path, "fallback", (msg.params.message || "Host declined the file-open request. Use the inline test panel instead."));
                            appendLog("Host declined file open: " + path, "warn");
                        }
                        render();
                    }
                    return;
                }
                if (msg.method === "ui/notifications/host-context-changed") { state.hostContext = merge(state.hostContext, msg.params || {}); render(); }
            });

            document.addEventListener("pointerdown", function (event) {
                var button = event.target && event.target.closest ? event.target.closest("button[data-tool-action='true']") : null;
                if (!button) return;
                appendLog("Pointer down on " + buttonLogLabel(button), "info");
            }, true);

            document.addEventListener("click", function (event) {
                var button = event.target && event.target.closest ? event.target.closest("button[data-tool-action='true']") : null;
                if (!button) return;
                appendLog("Click captured on " + buttonLogLabel(button), button.disabled ? "warn" : "info");
            }, true);

            document.addEventListener("click", function (event) {
                var button = event.target && event.target.closest ? event.target.closest("button[data-tool-action='true']") : null;
                if (!button) return;
                if (button.disabled) {
                    appendLog("Click ignored for disabled button: " + buttonLogLabel(button), "warn");
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                appendLog("Dispatching tool action: " + buttonLogLabel(button), "action");
                runToolAction(
                    button.dataset.toolTitle || "Run Action",
                    button.dataset.toolName || "",
                    decodeButtonArgs(button.dataset.toolArgs),
                    { refresh: button.dataset.toolRefresh === "true" }
                );
            });

            new ResizeObserver(function () { reportSize(); }).observe(document.body);

            (async function () {
                appendLog("Specrail Navigator initializing\u2026", "muted");
                try {
                    var init = await sendRequest("ui/initialize", {
                        protocolVersion: "2026-01-26",
                        clientInfo: { name: "specrail-navigator", version: "3.0.0" },
                        capabilities: {}, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
                    });
                    state.hostContext = (init && init.hostContext && typeof init.hostContext === "object") ? init.hostContext : {};
                    applyHostStyles();
                    sendNotification("ui/notifications/initialized", {});
                    appendLog("Connected. Ready.", "success");
                    render(); reportSize();
                } catch (e) { appendLog("Init error: " + (e && e.message ? e.message : String(e)), "error"); }
            })();
        })();
    </script>
</body>

</html>

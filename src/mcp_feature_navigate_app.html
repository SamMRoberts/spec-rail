<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specrail</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: light-dark(#edf2f8, #0d1118);
            --bg-card: light-dark(rgba(255, 255, 255, 0.82), rgba(20, 27, 38, 0.9));
            --bg-card-hover: light-dark(rgba(255, 255, 255, 0.97), rgba(30, 38, 52, 0.96));
            --bg-section: light-dark(rgba(248, 250, 255, 0.88), rgba(14, 19, 28, 0.84));
            --fg: light-dark(#0f172a, #e5edf7);
            --fg-muted: light-dark(#64748b, #9da9ba);
            --fg-dim: light-dark(#94a3b8, #738094);
            --border: light-dark(rgba(148, 163, 184, 0.28), rgba(130, 145, 166, 0.2));
            --border-focus: light-dark(#3b82f6, #60a5fa);
            --accent: light-dark(#3563e9, #6ea8ff);
            --accent-soft: light-dark(rgba(231, 240, 255, 0.92), rgba(29, 43, 66, 0.9));
            --active-bg: light-dark(rgba(255, 248, 228, 0.92), rgba(48, 35, 6, 0.86));
            --active-border: light-dark(#f59e0b, #f59e0b);
            --active-fg: light-dark(#92400e, #fbbf24);
            --verified-bg: light-dark(rgba(236, 253, 245, 0.94), rgba(6, 42, 24, 0.88));
            --verified-border: light-dark(#22c55e, #22c55e);
            --verified-fg: light-dark(#166534, #4ade80);
            --failed-bg: light-dark(rgba(255, 241, 242, 0.94), rgba(63, 11, 18, 0.88));
            --failed-border: light-dark(#ef4444, #ef4444);
            --failed-fg: light-dark(#991b1b, #fca5a5);
            --pending-bg: light-dark(rgba(248, 250, 252, 0.94), rgba(29, 35, 46, 0.92));
            --pending-border: light-dark(#cbd5e1, #4b5563);
            --pending-fg: light-dark(#64748b, #9ca3af);
            --progress-track: light-dark(rgba(203, 213, 225, 0.72), rgba(51, 65, 85, 0.9));
            --progress-fill: light-dark(#22c55e, #22c55e);
            --hero-start: light-dark(rgba(255, 255, 255, 0.95), rgba(21, 28, 39, 0.98));
            --hero-end: light-dark(rgba(238, 244, 255, 0.88), rgba(14, 19, 29, 0.92));
            --hero-outline: light-dark(rgba(148, 163, 184, 0.22), rgba(151, 173, 201, 0.15));
            --hero-glow: light-dark(rgba(53, 99, 233, 0.22), rgba(110, 168, 255, 0.18));
            --hero-sheen: light-dark(rgba(34, 197, 94, 0.12), rgba(74, 222, 128, 0.1));
            --hero-figure-a: light-dark(#dbeafe, #1f3b63);
            --hero-figure-b: light-dark(#bfdbfe, #305789);
            --hero-figure-c: light-dark(#ffffff, #0f1723);
            --shadow-sm: light-dark(0 10px 24px rgba(15, 23, 42, 0.08), 0 12px 30px rgba(2, 6, 23, 0.45));
            --shadow-lg: light-dark(0 24px 70px rgba(15, 23, 42, 0.12), 0 28px 80px rgba(2, 6, 23, 0.55));
            --radius: 6px;
            --radius-lg: 16px;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-ui);
            font-size: 13px;
            background:
                radial-gradient(circle at top left, color-mix(in srgb, var(--hero-glow) 100%, transparent), transparent 32%),
                radial-gradient(circle at top right, color-mix(in srgb, var(--hero-sheen) 100%, transparent), transparent 28%),
                var(--bg);
            color: var(--fg);
            line-height: 1.5;
            padding: 12px;
        }

        /* App shell */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 760px;
            min-height: 320px;
            height: 100%;
            max-height: 100%;
            margin: 0 auto;
            position: relative;
            isolation: isolate;
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg-card) 94%, transparent), color-mix(in srgb, var(--bg-section) 92%, transparent));
            overflow: hidden;
            border-radius: var(--radius-lg);
            border: 1px solid color-mix(in srgb, var(--border) 88%, transparent);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(16px);
        }

        .app::before,
        .app::after {
            content: "";
            position: absolute;
            inset: auto auto 0 0;
            pointer-events: none;
            z-index: -1;
            border-radius: 999px;
            filter: blur(12px);
            opacity: 0.9;
        }

        .app::before {
            width: 180px;
            height: 180px;
            background: color-mix(in srgb, var(--hero-glow) 72%, transparent);
            top: -40px;
            right: -40px;
            left: auto;
        }

        .app::after {
            width: 150px;
            height: 150px;
            background: color-mix(in srgb, var(--hero-sheen) 78%, transparent);
            bottom: 92px;
            left: -30px;
        }

        .app-header {
            flex-shrink: 0;
            background: color-mix(in srgb, var(--bg-card) 84%, transparent);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            backdrop-filter: blur(16px);
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            padding: 16px 16px 18px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .app-body::-webkit-scrollbar {
            width: 5px;
        }

        .app-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .app-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px 4px;
        }

        .header-logo {
            font-size: 18px;
            line-height: 1;
            filter: drop-shadow(0 6px 10px rgba(37, 99, 235, 0.18));
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-tag {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: color-mix(in srgb, var(--accent-soft) 82%, transparent);
            color: var(--accent);
            padding: 3px 7px;
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--border-focus) 55%, transparent);
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Workflow stepper */
        .workflow-bar {
            display: flex;
            align-items: center;
            padding: 8px 16px 10px;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .workflow-bar::-webkit-scrollbar {
            display: none;
        }

        .wf-step {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 500;
            color: var(--fg-dim);
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
        }

        .wf-num {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid var(--pending-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            background: var(--bg-card);
            flex-shrink: 0;
            transition: all 120ms;
        }

        .wf-step.wf-done .wf-num {
            background: var(--verified-border);
            border-color: var(--verified-border);
            color: #fff;
        }

        .wf-step.wf-active .wf-num {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
        }

        .wf-step.wf-active .wf-label {
            color: var(--accent);
            font-weight: 700;
        }

        .wf-step.wf-done .wf-label {
            color: var(--verified-fg);
        }

        .wf-sep {
            width: 14px;
            height: 1.5px;
            background: var(--pending-border);
            flex-shrink: 0;
            margin: 0 2px;
        }

        .wf-sep.wf-done {
            background: var(--verified-border);
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--fg-muted);
            padding: 6px 16px 9px;
            border-top: 1px solid var(--border);
        }

        .bc-item.clickable {
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }

        .bc-item.clickable:hover {
            text-decoration: underline;
        }

        .bc-sep {
            color: var(--fg-dim);
            font-size: 12px;
        }

        /* Buttons */
        .btn {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: color-mix(in srgb, var(--bg-card) 96%, transparent);
            color: var(--fg);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            padding: 5px 10px;
            transition: background 80ms, border-color 80ms, opacity 80ms, transform 80ms;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
            transform: translateY(-1px);
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            border-color: var(--accent);
        }

        .btn-success {
            background: var(--verified-border);
            border-color: var(--verified-border);
            color: #fff;
        }

        .btn-success:hover {
            filter: brightness(1.1);
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--fg-muted);
        }

        .btn-ghost:hover {
            background: var(--bg-card-hover);
            border-color: var(--border);
            color: var(--fg);
        }

        .btn-danger {
            background: transparent;
            border-color: transparent;
            color: var(--failed-fg);
        }

        .btn-danger:hover {
            background: var(--failed-bg);
            border-color: var(--failed-border);
        }

        .btn-sm {
            padding: 4px 9px;
            font-size: 11px;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-chip {
            background: color-mix(in srgb, var(--bg-card) 94%, transparent);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11px;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        .stat-chip strong {
            color: var(--fg);
            font-weight: 700;
        }

        .hero-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 152px;
            gap: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border-radius: 22px;
            border: 1px solid var(--hero-outline);
            background:
                linear-gradient(145deg, var(--hero-start), var(--hero-end)),
                radial-gradient(circle at top right, color-mix(in srgb, var(--hero-glow) 70%, transparent), transparent 48%);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            position: relative;
        }

        .hero-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(130deg, transparent 38%, color-mix(in srgb, var(--hero-sheen) 34%, transparent) 100%);
            pointer-events: none;
        }

        .hero-copy,
        .hero-figure {
            position: relative;
            z-index: 1;
        }

        .hero-copy {
            min-width: 0;
        }

        .hero-kicker {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .hero-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 7px;
        }

        .hero-title {
            font-size: 22px;
            line-height: 1.05;
            font-weight: 750;
            letter-spacing: -0.04em;
            color: var(--fg);
        }

        .hero-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--border-focus) 36%, transparent);
            background: color-mix(in srgb, var(--accent-soft) 76%, transparent);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
        }

        .hero-desc {
            font-size: 12px;
            line-height: 1.6;
            color: var(--fg-muted);
            max-width: 52ch;
        }

        .hero-meta {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            padding: 6px 10px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--bg-card) 86%, transparent);
            border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
            color: var(--fg-muted);
            font-size: 11px;
        }

        .hero-meta::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--verified-border) 70%, var(--accent)));
            box-shadow: 0 0 0 5px color-mix(in srgb, var(--hero-glow) 55%, transparent);
            flex-shrink: 0;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 14px;
        }

        .hero-stat {
            padding: 10px 11px;
            border-radius: 16px;
            border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
            background: color-mix(in srgb, var(--bg-card) 90%, transparent);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
            min-width: 0;
        }

        .hero-stat-value {
            font-size: 17px;
            line-height: 1.1;
            font-weight: 760;
            letter-spacing: -0.03em;
            color: var(--fg);
        }

        .hero-stat-label {
            margin-top: 3px;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        .hero-stat.tone-success .hero-stat-value {
            color: var(--verified-fg);
        }

        .hero-stat.tone-accent .hero-stat-value {
            color: var(--accent);
        }

        .hero-stat.tone-warn .hero-stat-value {
            color: var(--active-fg);
        }

        .hero-stat.tone-muted .hero-stat-value {
            color: var(--fg-muted);
        }

        .hero-figure {
            align-self: stretch;
            min-height: 132px;
            border-radius: 24px;
            position: relative;
            display: block;
            transform: perspective(900px) rotateX(7deg) rotateY(-10deg);
            transform-style: preserve-3d;
        }

        .hero-figure-shadow,
        .hero-figure-base,
        .hero-figure-card,
        .hero-figure-orb,
        .hero-figure-icon {
            position: absolute;
        }

        .hero-figure-shadow {
            inset: auto 18px 8px 22px;
            height: 18px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.18);
            filter: blur(16px);
            transform: translateZ(-12px);
        }

        .hero-figure-base {
            inset: 24px 14px 18px;
            border-radius: 28px;
            background: linear-gradient(160deg, var(--hero-figure-a), var(--hero-figure-b));
            box-shadow: 0 20px 30px rgba(37, 99, 235, 0.18);
        }

        .hero-figure-base::before,
        .hero-figure-base::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.4);
        }

        .hero-figure-base::before {
            width: 84px;
            height: 10px;
            left: 18px;
            top: 22px;
        }

        .hero-figure-base::after {
            width: 54px;
            height: 10px;
            left: 18px;
            top: 40px;
            opacity: 0.74;
        }

        .hero-figure-card {
            inset: 42px 28px 34px;
            border-radius: 20px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--hero-figure-c) 98%, transparent), color-mix(in srgb, var(--bg-card) 88%, transparent));
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
            transform: translateZ(18px);
        }

        .hero-figure-card::before,
        .hero-figure-card::after {
            content: "";
            position: absolute;
            left: 16px;
            right: 16px;
            border-radius: 999px;
        }

        .hero-figure-card::before {
            top: 18px;
            height: 10px;
            background: color-mix(in srgb, var(--accent-soft) 72%, white);
        }

        .hero-figure-card::after {
            top: 36px;
            height: 8px;
            background: color-mix(in srgb, var(--border) 72%, white);
        }

        .hero-figure-orb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            right: 20px;
            top: 20px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), color-mix(in srgb, var(--verified-border) 74%, var(--accent)));
            box-shadow: 0 16px 30px rgba(34, 197, 94, 0.2);
            transform: translateZ(26px);
        }

        .hero-figure-icon {
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            transform: translateZ(34px);
            text-shadow: 0 12px 24px rgba(15, 23, 42, 0.18);
        }

        /* Next step banner */
        .next-banner {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 12px 13px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--accent);
            background: color-mix(in srgb, var(--accent-soft) 86%, transparent);
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }

        .next-banner-icon {
            font-size: 17px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .next-banner-body {
            flex: 1;
            min-width: 0;
        }

        .next-banner-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .next-banner-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 3px;
        }

        .next-banner-desc {
            font-size: 11px;
            color: var(--fg-muted);
            line-height: 1.5;
        }

        .next-banner-actions {
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .hierarchy-panel {
            margin-bottom: 14px;
            padding: 12px 13px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg-card) 94%, transparent);
            box-shadow: var(--shadow-sm);
        }

        .hierarchy-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .hierarchy-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--fg);
        }

        .hierarchy-copy {
            font-size: 11px;
            color: var(--fg-muted);
            line-height: 1.45;
            margin-top: 2px;
        }

        .hierarchy-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .hierarchy-field {
            display: grid;
            gap: 6px;
            min-width: 0;
        }

        .hierarchy-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        .hierarchy-select {
            width: 100%;
            appearance: none;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: color-mix(in srgb, var(--bg-card) 96%, transparent);
            color: var(--fg);
            font: inherit;
            font-size: 12px;
            line-height: 1.3;
            padding: 9px 11px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .hierarchy-select:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
        }

        .hierarchy-select:disabled {
            opacity: 0.6;
        }

        .hierarchy-meta {
            font-size: 10px;
            color: var(--fg-muted);
            min-height: 15px;
        }

        @media (max-width: 680px) {
            .hierarchy-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        /* Cards */
        .feature-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card {
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg-card) 98%, transparent), color-mix(in srgb, var(--bg-section) 80%, transparent));
            border: 1px solid var(--border);
            border-radius: 18px;
            transition: border-color 100ms, box-shadow 100ms, transform 100ms;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
        }

        .card:hover {
            border-color: var(--border-focus);
            box-shadow: 0 14px 28px light-dark(rgba(15, 23, 42, 0.08), rgba(2, 6, 23, 0.34));
            transform: translateY(-1px);
        }

        .card.active-card {
            border-color: var(--active-border);
            background: var(--active-bg);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--active-border) 18%, transparent);
        }

        .card-collapsible,
        .outcome-item-collapsible {
            overflow: hidden;
        }

        .card-summary,
        .outcome-summary {
            list-style: none;
            cursor: pointer;
            padding: 11px 13px;
            user-select: none;
        }

        .card-summary::-webkit-details-marker,
        .outcome-summary::-webkit-details-marker {
            display: none;
        }

        .card-summary:hover,
        .outcome-summary:hover {
            background: color-mix(in srgb, var(--bg-card-hover) 75%, transparent);
        }

        .card-content,
        .outcome-content {
            padding: 0 13px 12px;
        }

        .card-toggle,
        .outcome-toggle {
            font-size: 10px;
            color: var(--fg-muted);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .card-toggle::before,
        .outcome-toggle::before {
            content: "\25B8";
            font-size: 10px;
            transition: transform 120ms ease;
            display: inline-block;
        }

        .card-collapsible[open] .card-toggle::before,
        .outcome-item-collapsible[open] .outcome-toggle::before {
            transform: rotate(90deg);
        }

        .card-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-id {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg-muted);
            margin-bottom: 1px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
        }

        .card-meta {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .card-note {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 9px;
            line-height: 1.55;
        }

        /* Progress */
        .progress-wrap {
            margin-top: 4px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--fg-muted);
            margin-bottom: 3px;
        }

        .progress-bar {
            height: 4px;
            background: var(--progress-track);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 2px;
            transition: width 400ms ease;
        }

        .progress-fill.passing {
            background: var(--verified-border);
        }

        .progress-fill.written {
            background: var(--accent);
        }

        .progress-fill.planned {
            background: var(--active-border);
        }

        .progress-fill.failing {
            background: var(--failed-border);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 20px;
            border: 1px solid;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-active {
            background: var(--active-bg);
            border-color: var(--active-border);
            color: var(--active-fg);
        }

        .badge-verified {
            background: var(--verified-bg);
            border-color: var(--verified-border);
            color: var(--verified-fg);
        }

        .badge-failed {
            background: var(--failed-bg);
            border-color: var(--failed-border);
            color: var(--failed-fg);
        }

        .badge-pending {
            background: var(--pending-bg);
            border-color: var(--pending-border);
            color: var(--pending-fg);
        }

        .badge-skipped {
            background: var(--pending-bg);
            border-color: var(--pending-border);
            color: var(--fg-dim);
        }

        .btn-status {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--bg-card) 82%, transparent);
        }

        .btn-status-success {
            background: var(--verified-border);
        }

        .btn-status-warning {
            background: var(--active-border);
        }

        .btn-status-progress {
            background: var(--accent);
            animation: btn-status-pulse 900ms ease-in-out infinite;
        }

        .btn-status-danger {
            background: var(--failed-border);
        }

        .btn-status-muted {
            background: var(--fg-dim);
        }

        @keyframes btn-status-pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.55;
                transform: scale(0.84);
            }
        }

        /* Test chips */
        .test-chips {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            margin-top: 3px;
        }

        .test-chip {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-section);
            color: var(--fg-muted);
        }

        .test-chip.passing {
            color: var(--verified-fg);
            border-color: var(--verified-border);
            background: var(--verified-bg);
        }

        .test-chip.warning {
            color: var(--active-fg);
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .test-chip.danger {
            color: var(--failed-fg);
            border-color: var(--failed-border);
            background: var(--failed-bg);
        }

        /* Outcomes */
        .outcome-list {
            list-style: none;
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
        }

        .outcome-item {
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg-card) 98%, transparent), color-mix(in srgb, var(--bg-section) 82%, transparent));
            border: 1px solid var(--border);
            border-radius: 18px;
            transition: border-color 100ms, box-shadow 100ms;
        }

        .outcome-item:hover {
            border-color: var(--border-focus);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
        }

        .outcome-item.active-outcome {
            border-color: var(--active-border);
            background: var(--active-bg);
        }

        .outcome-item.verified-outcome {
            border-left: 3px solid var(--verified-border);
        }

        .outcome-item.failed-outcome {
            border-left: 3px solid var(--failed-border);
        }

        .outcome-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .outcome-body {
            flex: 1;
            min-width: 0;
        }

        .outcome-num {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg-muted);
            margin-bottom: 1px;
        }

        .outcome-title {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
        }

        .outcome-id {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg-muted);
        }

        .outcome-goal {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }

        .section-card {
            margin-top: 10px;
            padding: 10px 11px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg-section) 96%, transparent);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .section-card:first-child {
            margin-top: 0;
        }

        .section-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .section-card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--fg);
        }

        .section-card-copy {
            font-size: 11px;
            color: var(--fg-muted);
            line-height: 1.45;
        }

        .delegation-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .delegation-prompt {
            margin-top: 8px;
            padding: 8px 9px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg-card) 96%, transparent);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 280px;
            overflow: auto;
        }

        .delegation-grid {
            display: grid;
            gap: 6px;
            margin-top: 8px;
        }

        .delegation-item {
            padding: 8px 9px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg-card) 96%, transparent);
        }

        .delegation-item-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--fg);
        }

        .delegation-item-meta {
            margin-top: 4px;
            font-size: 10px;
            color: var(--fg-muted);
            font-family: var(--font-mono);
        }

        .suggestion-list,
        .path-list,
        .related-test-list {
            list-style: none;
            display: grid;
            gap: 4px;
            margin-top: 6px;
        }


        .suggestion-preview-list {
            list-style: none;
            display: grid;
            gap: 5px;
            margin-top: 6px;
        }

        .suggestion-preview-item {
            padding: 6px;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .suggestion-preview-path {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg);
        }

        .suggestion-preview-copy {
            font-size: 10px;
            color: var(--fg-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .suggestion-preview-note {
            font-size: 10px;
            color: var(--fg-muted);
            margin-top: 6px;
        }

        .suggestion-list li,
        .path-list li {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg);
            padding: 4px 6px;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .related-test-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 8px;
            border-radius: 10px;
            background: color-mix(in srgb, var(--bg-card) 96%, transparent);
            border: 1px solid var(--border);
        }

        .related-test-main {
            flex: 1;
            min-width: 0;
        }

        .related-test-id {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--fg-muted);
        }

        .related-test-path {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .related-test-meta {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .related-test-status {
            font-size: 10px;
            margin-top: 4px;
            line-height: 1.35;
        }

        .related-test-status.pending {
            color: var(--accent);
        }

        .related-test-status.opened {
            color: var(--verified-fg);
        }

        .related-test-status.fallback {
            color: var(--active-fg);
        }

        .inline-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        /* Editor */
        .editor {
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .editor-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .field-grid {
            display: grid;
            gap: 8px;
        }

        label {
            display: grid;
            gap: 3px;
            font-size: 12px;
        }

        label span {
            font-weight: 600;
            color: var(--fg-muted);
            font-size: 11px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-section);
            color: var(--fg);
            padding: 5px 8px;
            font: inherit;
            font-size: 12px;
            transition: border-color 100ms;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--border-focus) 20%, transparent);
        }

        textarea {
            min-height: 60px;
            resize: vertical;
        }

        .field-hint {
            font-size: 10px;
            color: var(--fg-muted);
        }

        /* Empty */
        .empty {
            text-align: center;
            padding: 30px 18px;
            color: var(--fg-muted);
            border: 1.5px dashed var(--border);
            border-radius: 20px;
            font-size: 12px;
            line-height: 1.6;
            background: color-mix(in srgb, var(--bg-card) 82%, transparent);
        }

        .empty-icon {
            font-size: 26px;
            margin-bottom: 7px;
        }

        .empty-title {
            font-weight: 600;
            color: var(--fg);

        @media (max-width: 460px) {
            body {
                padding: 0;
            }

            .app {
                border-radius: 0;
                border-left: none;
                border-right: none;
            }

            .app-body {
                padding: 14px 12px 16px;
            }

            .wf-label {
                display: none;
            }

            .wf-sep {
                width: 8px;
            }

            .hero-panel {
                grid-template-columns: 1fr;
                padding: 14px;
            }

            .hero-figure {
                min-height: 108px;
                order: -1;
            }

        /* Status bar */
        .app-status-bar {
            flex-shrink: 0;
            height: 26px;
            min-height: 26px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: light-dark(rgba(15, 23, 42, 0.055), rgba(0, 0, 0, 0.32));
            border-top: 1px solid var(--border);
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--fg-muted);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            user-select: none;
        }

        .app-status-bar .sb-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--fg-dim);
        }

        .app-status-bar.sb-action .sb-dot {
            background: var(--accent);
        }

        .app-status-bar.sb-success .sb-dot {
            background: var(--verified-border);
        }

        .app-status-bar.sb-error .sb-dot {
            background: var(--failed-border);
        }

        .app-status-bar.sb-warn .sb-dot {
            background: var(--active-border);
        }

        .app-status-bar.sb-action {
            color: var(--fg);
        }

        .app-status-bar.sb-success {
            color: var(--verified-fg);
        }

        .app-status-bar.sb-error {
            color: var(--failed-fg);
        }

        .app-status-bar.sb-warn {
            color: var(--active-fg);
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="app-header">
            <div class="header">
                <span class="header-logo">&#x1F682;</span>
                <span class="header-title">Specrail</span>
                <span class="header-tag">TDD</span>
                <div class="header-actions" id="headerActions"></div>
            </div>
            <div id="workflowBar" class="workflow-bar"></div>
            <div id="breadcrumbBar"></div>
        </div>
        <div class="app-body" id="root">
            <div class="empty">
                <div class="empty-icon">&#x1F682;</div>
                <div class="empty-title">Specrail</div>
                <div>Connecting&hellip;</div>
            </div>
        </div>
        <div id="appStatusBar" class="app-status-bar" aria-live="polite" aria-label="Status">
            <span class="sb-dot"></span>
            <span id="appStatusText">Ready</span>
        </div>
    </div>

    <script>
        (() => {
            const state = {
                hostContext: {}, toolArguments: {}, toolResult: null,
                pendingFeatureId: null, editingFeatureId: null, editingOutcomeId: null,
                creatingFeature: false, creatingOutcome: false,
                featureDraft: null, outcomeDraft: null, newFeatureDraft: null, newOutcomeDraft: null,
                isSaving: false, isActivating: null,
                hierarchySelection: { solutionId: "", projectId: "", componentId: "" },
                runningHierarchyAction: null,
                runningAction: null,
                expandedCards: {},
                expandedPanels: {},
                fileOpenStates: {},
                suggestionPreviews: {},
                suggestionPreviewErrors: {},
                implementationDelegations: {},
            };
            let nextId = 1;
            const pending = new Map();

            // appendLog(message, level) — level: 'action' | 'success' | 'error' | 'warn' | 'muted' | 'info'
            function appendLog(message, level) {
                var bar = document.getElementById("appStatusBar");
                var text = document.getElementById("appStatusText");
                if (!bar || !text) return;
                var lvl = level || "muted";
                bar.className = "app-status-bar" + (lvl !== "muted" && lvl !== "info" ? " sb-" + lvl : "");
                text.textContent = String(message == null ? "" : message);
            }

            // IPC
            function sendRequest(m, p) {
                var id = nextId++;
                window.parent.postMessage({ jsonrpc: "2.0", id: id, method: m, params: p }, "*");
                return new Promise(function (res, rej) { pending.set(id, { resolve: res, reject: rej }); });
            }
            function sendRequestWithTimeout(m, p, timeoutMs) {
                var id = nextId++;
                window.parent.postMessage({ jsonrpc: "2.0", id: id, method: m, params: p }, "*");
                return new Promise(function (res, rej) {
                    var timeout = setTimeout(function () {
                        if (!pending.has(id)) return;
                        pending.delete(id);
                        rej(new Error("Timed out waiting for host acknowledgement."));
                    }, timeoutMs || 800);
                    pending.set(id, {
                        resolve: function (value) {
                            clearTimeout(timeout);
                            res(value);
                        },
                        reject: function (error) {
                            clearTimeout(timeout);
                            rej(error);
                        }
                    });
                });
            }
            function sendNotification(m, p) { window.parent.postMessage({ jsonrpc: "2.0", method: m, params: p }, "*"); }
            function sendResponse(id, r) { window.parent.postMessage({ jsonrpc: "2.0", id: id, result: r }, "*"); }
            function callTool(name, args) { return sendRequest("tools/call", { name: name, arguments: args }); }

            // Utilities
            function esc(v) {
                return String(v == null ? "" : v)
                    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;").replaceAll('"', '&quot;').replaceAll("'", "&#39;");
            }
            function toolText(r) { return (r && r.content && r.content.find(function (b) { return b && b.type === "text"; }) || {}).text || ""; }
            function merge(t, s) {
                if (!s || typeof s !== "object") return t;
                Object.entries(s).forEach(function (kv) {
                    var k = kv[0], v = kv[1];
                    t[k] = (v && typeof v === "object" && !Array.isArray(v))
                        ? merge(t[k] && typeof t[k] === "object" ? t[k] : {}, v) : v;
                });
                return t;
            }
            function linesToArray(v) { return String(v == null ? "" : v).split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
            function arrayToLines(v) { return Array.isArray(v) ? v.join("\n") : ""; }
            function cardStateKey(kind) {
                var parts = Array.prototype.slice.call(arguments, 1).map(function (p) { return String(p == null ? "" : p); });
                return [kind].concat(parts).join(":");
            }
            function panelStateKey(kind) {
                var parts = Array.prototype.slice.call(arguments, 1).map(function (p) { return String(p == null ? "" : p); });
                return [kind].concat(parts).join(":");
            }
            function isCardExpanded(key, accordionGroup) {
                return accordionGroup ? state.expandedCards[accordionGroup] === key : state.expandedCards[key] === true;
            }
            function setCardExpanded(key, expanded, accordionGroup) {
                if (accordionGroup) {
                    if (expanded) state.expandedCards[accordionGroup] = key;
                    else if (state.expandedCards[accordionGroup] === key) delete state.expandedCards[accordionGroup];
                    return;
                }
                state.expandedCards[key] = expanded;
            }
            function ensureCardExpanded(key, accordionGroup) {
                if (!isCardExpanded(key, accordionGroup)) setCardExpanded(key, true, accordionGroup);
            }
            function isPanelExpanded(key) { return state.expandedPanels[key] === true; }
            function togglePanelExpanded(key) {
                state.expandedPanels[key] = !state.expandedPanels[key];
                render();
            }

            // Workflow steps
            var WORKFLOW_STEPS = [
                { id: "feature", label: "Feature", tip: "Select or create a feature to work on" },
                { id: "outcome", label: "Outcome", tip: "Choose an outcome milestone to target" },
                { id: "tests", label: "Tests", tip: "Write tests that define the outcome" },
                { id: "implement", label: "Implement", tip: "Run AI-assisted implementation" },
                { id: "verify", label: "Verify", tip: "Run tests to confirm implementation" },
                { id: "advance", label: "Advance", tip: "Move to the next outcome or complete feature" },
            ];

            function computeWorkflowStep(data) {
                if (!data) return "feature";
                var mode = data.mode;
                var features = Array.isArray(data.features) ? data.features : [];

                if (mode === "outcome_selection") {
                    var outcomes = Array.isArray(data.outcomes) ? data.outcomes : [];
                    if (!outcomes.length) return "outcome";
                    var activeOutcome = outcomes.find(function (o) { return o.isActive; });
                    if (!activeOutcome) return "outcome";
                    var selectedFeatureSummary = featureSummaryById(data, data.selectedFeatureId || data.activeFeatureId);
                    var verifyStatus = featureActionStatus(selectedFeatureSummary, "verifyStatus", "Verify outcomes after implement succeeds.");
                    var hasTestGaps = outcomeHasTestGaps(activeOutcome);
                    var st = activeOutcome.status;
                    if (st === "verified") return "advance";
                    if (hasTestGaps) return "tests";
                    if (st === "failed") return "implement";
                    if (String(verifyStatus.label || "") === "Needed") return "verify";
                    return "implement";
                }

                if (!features.length) return "feature";
                if (!data.activeFeatureId) return "feature";
                return "feature";
            }

            function renderWorkflowBar(data) {
                var bar = document.getElementById("workflowBar");
                if (!bar) return;
                bar.innerHTML = "";
                var currentStepId = computeWorkflowStep(data);
                var currentIdx = WORKFLOW_STEPS.findIndex(function (s) { return s.id === currentStepId; });

                WORKFLOW_STEPS.forEach(function (step, i) {
                    var isDone = i < currentIdx;
                    var isActive = i === currentIdx;

                    var el = document.createElement("div");
                    el.className = "wf-step" + (isDone ? " wf-done" : "") + (isActive ? " wf-active" : "");
                    el.title = step.tip;

                    var num = document.createElement("div");
                    num.className = "wf-num";
                    num.textContent = isDone ? "\u2713" : String(i + 1);
                    el.appendChild(num);

                    var lbl = document.createElement("span");
                    lbl.className = "wf-label";
                    lbl.textContent = step.label;
                    el.appendChild(lbl);
                    bar.appendChild(el);

                    if (i < WORKFLOW_STEPS.length - 1) {
                        var sep = document.createElement("div");
                        sep.className = "wf-sep" + (isDone ? " wf-done" : "");
                        bar.appendChild(sep);
                    }
                });
            }

            // Next step banner

                                },

                                actions = [
                                    {
                                        text: "Review Tests",
                                        tool: testReviewTool,
                                        args: { feature_id: data.selectedFeatureId, outcome_id: activeOutcome.id },

                                    },
                                    {
                                        text: "Run Implement",
                                        tool: implementTool,

                body.className = "next-banner-body";
                body.innerHTML =
                    '<div class="next-banner-label">' + esc(label) + '</div>' +
                    '<div class="next-banner-title">' + esc(title) + '</div>' +
                    '<div class="next-banner-desc">' + esc(desc) + '</div>';
                if (actions.length) {
                    var act = document.createElement("div");
                    act.className = "next-banner-actions btn-group";
                    actions.forEach(function (a) {
                        if (a.tool) {
                            appendActionButton(act, {
                                title: a.text,
                                tool: a.tool,
                                args: a.args || {},
                                kind: a.kind || "default",

                                tooltip: a.tooltip,
                                status: a.status || null,

                        var b = document.createElement("button");
                        b.type = "button";
                        b.className = "btn btn-sm btn-" + (a.kind || "default");

                            b.title = a.tooltip || a.status.detail;
                        }
                        b.disabled = state.isSaving || !!state.runningAction;
                        var label = document.createElement("span");
                        label.textContent = a.text;
                        b.appendChild(label);
                        if (a.status) {
                            var tone = String(a.status.tone || "muted");

                banner.appendChild(iconEl);
                banner.appendChild(body);

            // Collapsible cards
            function updateCollapsibleToggleLabel(details, collapsedLabel, expandedLabel) {
                var toggle = details && details.querySelector("summary .card-toggle, summary .outcome-toggle");
                if (toggle) toggle.textContent = details.open ? expandedLabel : collapsedLabel;
            }

            function makeCollapsibleCard(options) {
                var key = options.key, baseClass = options.baseClass, extraClass = options.extraClass || "",
                    summaryClass = options.summaryClass, contentClass = options.contentClass,
                    toggleClass = options.toggleClass, collapsedLabel = options.collapsedLabel,
                    expandedLabel = options.expandedLabel, buildSummary = options.buildSummary,
                    buildContent = options.buildContent, accordionGroup = options.accordionGroup;

                var details = document.createElement("details");
                details.className = (baseClass + " " + extraClass).trim();
                details.dataset.cardKey = key;
                if (accordionGroup) details.dataset.accordionGroup = accordionGroup;
                details.open = isCardExpanded(key, accordionGroup);
                details.addEventListener("toggle", function () {
                    setCardExpanded(key, details.open, accordionGroup);
                    updateCollapsibleToggleLabel(details, collapsedLabel, expandedLabel);

                    if (details.open && accordionGroup) {
                        Array.prototype.forEach.call(
                            document.querySelectorAll("details[data-accordion-group]"),
                            function (other) {
                                if (other === details) return;
                                if (other.dataset.accordionGroup !== accordionGroup) return;
                                if (!other.open) return;
                                other.open = false;
                            }
                        );
                    }

                    reportSize();
                });

                var summary = document.createElement("summary");
                summary.className = summaryClass;
                buildSummary(summary, details.open);

                var toggle = document.createElement("span");
                toggle.className = toggleClass;
                toggle.textContent = details.open ? expandedLabel : collapsedLabel;
                summary.appendChild(toggle);
                details.appendChild(summary);

                var content = document.createElement("div");
                content.className = contentClass;
                buildContent(content);
                details.appendChild(content);
                return details;
            }

            // Badge
            function badge(status) {
                var map = {
                    active: ["badge-active", "\u26A1 Active"],
                    verified: ["badge-verified", "\u2705 Verified"],
                    failed: ["badge-failed", "\u2717 Failed"],
                    pending: ["badge-pending", "\u25CB Pending"],
                    skipped: ["badge-skipped", "\u2013 Skipped"],
                    planned: ["badge-pending", "\u25CB Planned"],
                };
                var pair = map[status] || ["badge-pending", status];
                var el = document.createElement("span");
                el.className = "badge " + pair[0];
                el.textContent = pair[1];
                return el;
            }

            // Core actions
            async function selectFeature(featureId) {
                state.pendingFeatureId = featureId; render();
                appendLog("Opening feature: " + featureId, "action");
                try {
                    state.toolResult = await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments, { feature_id: featureId }));
                    state.pendingFeatureId = null; state.editingFeatureId = null; state.featureDraft = null;
                    state.creatingOutcome = false; state.newOutcomeDraft = null;
                    appendLog("Loaded feature: " + featureId, "success");
                    render();
                } catch (e) {
                    state.pendingFeatureId = null;
                    appendLog("Error: " + (e && e.message ? e.message : String(e)), "error");
                    render();
                }
            }

            async function returnToFeatures() {
                state.editingFeatureId = null; state.editingOutcomeId = null;
                state.featureDraft = null; state.outcomeDraft = null;
                state.creatingFeature = false; state.newFeatureDraft = null;
                appendLog("Returning to feature list\u2026", "muted");
                try {
                    state.toolResult = await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments));
                    appendLog("Feature list loaded.", "success"); render();
                } catch (e) { appendLog("Error: " + (e && e.message ? e.message : String(e)), "error"); render(); }
            }

            async function refreshView() {
                var sc = state.toolResult && state.toolResult.structuredContent;
                state.toolResult = (sc && sc.mode === "outcome_selection" && sc.selectedFeatureId)
                    ? await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments, { feature_id: sc.selectedFeatureId }))
                    : await callTool("specrail_feature_navigate", Object.assign({}, state.toolArguments));
            }

            async function runToolAction(title, name, args, options) {
                args = args || {}; options = options || {};
                var refresh = options.refresh || false;
                var actionKey = name + ":" + JSON.stringify(args);
                state.runningAction = actionKey;
                appendLog("Running: " + title + "\u2026", "action");
                render();
                try {
                    var result = await callTool(name, Object.assign({}, state.toolArguments, args));
                    var text = toolText(result);
                    if (result && result.isError) {
                        appendLog(title + " failed: " + (text || "Unknown error"), "error");
                        state.runningAction = null; render(); return;
                    }
                    if (name === "specrail_implement" && rememberImplementationDelegation(result, args)) {
                        refresh = false;
                        appendLog(title + " prompt ready. Review the implementation prompt in the outcome panel.", "success");
                        var sc = result && result.structuredContent;
                        if (sc && sc.delegation && typeof sc.delegation === "object") {
                            await startChatForDelegation(sc.delegation);
                        }
                    }
                    // Clear cached implementation delegation when the outcome is verified or advanced
                    if (name === "specrail_verify" || name === "specrail_advance") {
                        var sc2 = state.toolResult && state.toolResult.structuredContent;
                        var fid = sc2 && sc2.selectedFeatureId;
                        var oid = sc2 && sc2.activeOutcomeId;
                        if (fid && oid) {
                            delete state.implementationDelegations[implementationDelegationKey(fid, oid)];
                            delete state.implementationDelegations[implementationDelegationKey(fid, "*")];
                        }
                    }
                    if (text) appendLog(title + ": " + text, "success");
                    else appendLog(title + " completed.", "success");
                    if (refresh) await refreshView();
                    state.runningAction = null; render();
                } catch (e) {
                    appendLog(title + " error: " + (e && e.message ? e.message : String(e)), "error");
                    state.runningAction = null; render();
                }
            }

            function isActionRunning(name, args) {
                args = args || {};
                return state.runningAction === (name + ":" + JSON.stringify(args));
            }

            function buttonStatus(status, tool, args, title) {
                if (tool && isActionRunning(tool, args)) {
                    return {
                        tone: "progress",
                        label: "In progress",
                        detail: (title || "Action") + " is currently running."
                    };
                }
                return status || null;
            }

            function encodeButtonArgs(args) {
                try {
                    return JSON.stringify(args || {});
                } catch (e) {
                    return "{}";
                }
            }

            function decodeButtonArgs(value) {
                if (!value) return {};
                try {
                    var parsed = JSON.parse(value);
                    return parsed && typeof parsed === "object" ? parsed : {};
                } catch (e) {
                    return {};
                }
            }

            function buttonLogLabel(button) {
                if (!button) return "unknown action";
                var title = button.dataset.toolTitle || button.getAttribute("aria-label") || button.textContent || "unknown action";
                var source = button.dataset.toolSource || "unknown-source";
                var tool = button.dataset.toolName || "unknown-tool";
                return title.trim() + " [" + tool + "] from " + source;
            }

            function appendActionButton(container, config) {
                var title = config.title, tool = config.tool, args = config.args || {},
                    kind = config.kind || "default", refresh = config.refresh || false,
                    status = buttonStatus(config.status || null, tool, args, title), disabled = !!config.disabled;
                var button = document.createElement("button");
                button.type = "button";
                button.className = kind === "primary" ? "btn btn-primary btn-sm"
                    : kind === "ghost" ? "btn btn-ghost btn-sm"
                        : kind === "success" ? "btn btn-success btn-sm"
                            : kind === "danger" ? "btn btn-danger btn-sm"
                                : "btn btn-sm";
                button.dataset.toolAction = "true";
                button.dataset.toolName = tool;
                button.dataset.toolTitle = title;
                button.dataset.toolArgs = encodeButtonArgs(args);
                button.dataset.toolRefresh = refresh ? "true" : "false";
                button.dataset.toolSource = config.source || "action-button";
                button.disabled = state.isSaving || isActionRunning(tool, args) || disabled;
                if (config.tooltip || (status && status.detail)) {
                    button.title = config.tooltip || status.detail;
                }
                var label = document.createElement("span");
                label.textContent = isActionRunning(tool, args) ? (title + "\u2026") : title;
                button.appendChild(label);
                if (status) {
                    var tone = String(status.tone || "muted");
                    var indicator = document.createElement("span");
                    indicator.className = "btn-status btn-status-" + tone;
                    indicator.setAttribute("aria-label", String(status.label || tone));
                    indicator.title = String(status.detail || status.label || "");
                    button.appendChild(indicator);
                }
                container.appendChild(button);
            }

            function featureSummaryById(data, featureId) {
                var features = Array.isArray(data && data.features) ? data.features : [];
                for (var i = 0; i < features.length; i += 1) {
                    if (features[i] && features[i].id === featureId) return features[i];
                }
                return null;
            }

            function nextActionTool(data, key, fallback) {
                var nextActions = data && data.nextActions;
                var tool = nextActions && typeof nextActions === "object" ? nextActions[key] : null;
                return typeof tool === "string" && tool ? tool : fallback;
            }

            function outcomeAvailableAction(outcome, action) {
                var actions = outcome && Array.isArray(outcome.availableActions) ? outcome.availableActions : [];
                return actions.indexOf(action) >= 0;
            }

            function outcomeHasTestGaps(outcome) {
                if (!outcome || typeof outcome !== "object") return false;
                if (outcome.hasTestGaps === true) return true;
                var review = getOutcomeReview(outcome);
                return !!(review && review.has_gaps);
            }

            function featureActionLabel(status) {
                return String((status && status.label) || "");
            }

            function featureActionStatus(featureSummary, key, fallbackDetail) {
                var status = featureSummary && featureSummary[key];
                if (!status || typeof status !== "object") {
                    return { tone: "muted", label: "Waiting", detail: fallbackDetail || "Status unavailable." };
                }
                return {
                    tone: String(status.tone || "muted"),
                    label: String(status.label || "Waiting"),
                    detail: String(status.detail || fallbackDetail || "Status unavailable.")
                };
            }

            async function activateFeature(id, toolName) {
                state.isActivating = id; render();
                appendLog("Activating feature: " + id, "action");
                try {
                    var sc = state.toolResult && state.toolResult.structuredContent;
                    await callTool(toolName || nextActionTool(sc, "activateFeatureTool", "specrail_feature_activate"), Object.assign({}, state.toolArguments, { id: id }));
                    await refreshView();
                    appendLog("Feature activated: " + id, "success");

                    appendLog("Error: " + (e && e.message ? e.message : String(e)), "error");
                    state.isActivating = null; render();
                }
            }

            async function activateOutcome(featureId, outcomeId, toolName) {
                state.isActivating = outcomeId; render();
                appendLog("Activating outcome: " + outcomeId, "action");
                try {
                    var sc = state.toolResult && state.toolResult.structuredContent;
                    await callTool(toolName || nextActionTool(sc, "activateOutcomeTool", "specrail_outcome_activate"), Object.assign({}, state.toolArguments, { feature_id: featureId, outcome_id: outcomeId }));
                    await refreshView();
                    appendLog("Outcome activated: " + outcomeId, "success");
                    state.isActivating = null; render();
                } catch (e) {
                    appendLog("Error: " + (e && e.message ? e.message : String(e)), "error");
                    state.isActivating = null; render();
                }
            }

            function hierarchyOptionLabel(item) {
                if (!item) return "";
                return (item.title && item.title !== item.id)
                    ? (item.title + " (" + item.id + ")")
                    : String(item.id || item.title || "");
            }

            function projectsForSolution(data, solutionId) {
                var projects = Array.isArray(data.projects) ? data.projects : [];
                return solutionId
                    ? projects.filter(function (project) { return project.solution_id === solutionId; })
                    : projects.slice();
            }

            function componentsForProject(data, projectId) {
                var components = Array.isArray(data.components) ? data.components : [];
                return projectId
                    ? components.filter(function (component) { return component.project_id === projectId; })
                    : components.slice();
            }

            function ensureHierarchySelection(data) {
                var solutions = Array.isArray(data.solutions) ? data.solutions : [];
                var activeSolutionId = data.activeSolutionId || (solutions[0] && solutions[0].id) || "";
                var nextSolutionId = state.hierarchySelection.solutionId || activeSolutionId;
                if (nextSolutionId && !solutions.some(function (solution) { return solution.id === nextSolutionId; })) {
                    nextSolutionId = activeSolutionId;
                }

                var availableProjects = projectsForSolution(data, nextSolutionId);
                var activeProjectId = data.activeProjectId || (availableProjects[0] && availableProjects[0].id) || "";
                var nextProjectId = state.hierarchySelection.projectId || activeProjectId;
                if (nextProjectId && !availableProjects.some(function (project) { return project.id === nextProjectId; })) {
                    nextProjectId = activeProjectId;
                }

                var availableComponents = componentsForProject(data, nextProjectId);
                var activeComponentId = data.activeComponentId || (availableComponents[0] && availableComponents[0].id) || "";
                var nextComponentId = state.hierarchySelection.componentId || activeComponentId;
                if (nextComponentId && !availableComponents.some(function (component) { return component.id === nextComponentId; })) {
                    nextComponentId = activeComponentId;
                }

                state.hierarchySelection = {
                    solutionId: nextSolutionId || "",
                    projectId: nextProjectId || "",
                    componentId: nextComponentId || "",
                };

                return {
                    solutions: solutions,
                    projects: availableProjects,
                    components: availableComponents,
                };
            }

            function setHierarchySelection(level, value, data) {
                var normalized = String(value || "");
                if (level === "solution") {
                    state.hierarchySelection.solutionId = normalized;
                    var availableProjects = projectsForSolution(data, normalized);
                    state.hierarchySelection.projectId = (availableProjects[0] && availableProjects[0].id) || "";
                    var availableComponents = componentsForProject(data, state.hierarchySelection.projectId);
                    state.hierarchySelection.componentId = (availableComponents[0] && availableComponents[0].id) || "";
                    render();
                    return;
                }

                if (level === "project") {
                    state.hierarchySelection.projectId = normalized;
                    var availableComponents = componentsForProject(data, normalized);
                    state.hierarchySelection.componentId = (availableComponents[0] && availableComponents[0].id) || "";
                    render();
                    return;
                }

                state.hierarchySelection.componentId = normalized;
                render();
            }

            async function activateHierarchy(level) {
                var selection = state.hierarchySelection || {};
                var id = level === "solution"
                    ? selection.solutionId
                    : level === "project"
                        ? selection.projectId
                        : selection.componentId;
                if (!id) return;

                var tool = level === "solution"
                    ? "specrail_solution_activate"
                    : level === "project"
                        ? "specrail_project_activate"
                        : "specrail_component_activate";
                var label = level.charAt(0).toUpperCase() + level.slice(1);
                state.runningHierarchyAction = level + ":" + id;
                appendLog("Switching active " + level + ": " + id, "action");
                render();
                try {
                    await callTool(tool, Object.assign({}, state.toolArguments, { id: id }));
                    state.editingFeatureId = null;

                    state.outcomeDraft = null;

            function renderHierarchySwitcher(data) {
                var options = ensureHierarchySelection(data);

                    '<div><div class="hierarchy-title">Active hierarchy path</div><div class="hierarchy-copy">Switch the active solution, project, or component to change the feature scope in this navigator.</div></div>' +

                    var meta = document.createElement("div");

                panel.appendChild(grid);
                return panel;
